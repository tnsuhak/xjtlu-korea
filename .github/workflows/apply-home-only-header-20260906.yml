name: Apply XJTLU home-only header

on:
  push:
    branches:
      - feature/xjtlu-campus-life-guides-20260902
    paths:
      - .github/workflows/apply-home-only-header-20260906.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/xjtlu-campus-life-guides-20260902
          fetch-depth: 0

      - name: Simplify all XJTLU page headers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          targets = [
              'index.html',
              'xjtlu-accommodation-sip-taicang.html',
              'xjtlu-admission-requirements-korea-2027.html',
              'xjtlu-clubs-student-organisations.html',
              'xjtlu-dual-degree-liverpool-2plus2.html',
              'xjtlu-exchange.html',
              'xjtlu-living-cost-2027.html',
              'xjtlu-programmes-careers-graduate-destinations.html',
              'xjtlu-sports-facilities.html',
              'xjtlu-student-videos.html',
              'xjtlu-tuition-scholarships-2027.html',
          ]

          main_css = r'''
          /* TNS HOME-ONLY HEADER START */
          .nav-links{display:flex!important;align-items:center!important;gap:0!important}
          .nav-links .home-only-nav{display:inline-flex!important;align-items:center;justify-content:center;background:var(--navy)!important;color:#fff!important;border:1px solid var(--navy);border-radius:4px;padding:9px 16px!important;font-size:13px!important;font-weight:700!important;text-decoration:none;white-space:nowrap}
          .nav-links .home-only-nav:hover{background:#1e3560!important;color:#fff!important}
          .nav-ham{display:none!important}
          @media(max-width:900px){.nav-links{display:flex!important}.nav-ham{display:none!important}}
          @media(max-width:560px){.nav-links .home-only-nav{padding:8px 11px!important;font-size:12px!important}.nav-logo-text span{display:none!important}}
          /* TNS HOME-ONLY HEADER END */
          '''

          detail_css = r'''
          /* TNS HOME-ONLY HEADER START */
          .navlinks{display:flex!important;align-items:center!important;gap:0!important}
          .navlinks .home-only-nav{display:inline-flex!important;align-items:center;justify-content:center;background:var(--navy)!important;color:#fff!important;border:1px solid var(--navy);border-radius:4px;padding:9px 15px!important;font-size:13px!important;font-weight:700!important;text-decoration:none!important;white-space:nowrap}
          .navlinks .home-only-nav:hover{opacity:.9}
          @media(max-width:760px){.navlinks{display:flex!important}.navlinks .home-only-nav{padding:8px 11px!important;font-size:12px!important}}
          /* TNS HOME-ONLY HEADER END */
          '''

          for name in targets:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'\n?/\* TNS HOME-ONLY HEADER START \*/.*?/\* TNS HOME-ONLY HEADER END \*/\n?', '\n', text, flags=re.S)

              if name == 'index.html':
                  new_nav = '<ul class="nav-links"><li><a class="home-only-nav" href="/">메인페이지로 가기</a></li></ul>'
                  text, n = re.subn(r'<ul class="nav-links">.*?</ul>', new_nav, text, count=1, flags=re.S)
                  if n != 1:
                      raise SystemExit(f'{name}: nav-links replacement failed ({n})')
                  text = re.sub(r'\s*<button[^>]*class="nav-ham"[^>]*>.*?</button>', '', text, count=1, flags=re.S)
                  text = text.replace('</style>', main_css + '\n</style>', 1)
              else:
                  new_nav = '<div class="navlinks"><a class="home-only-nav" href="/">메인페이지로 가기</a></div></nav>'
                  text, n = re.subn(r'<div class="navlinks">.*?</div>\s*</nav>', new_nav, text, count=1, flags=re.S)
                  if n != 1:
                      raise SystemExit(f'{name}: navlinks replacement failed ({n})')
                  text = text.replace('</style>', detail_css + '\n</style>', 1)

              if text.count('메인페이지로 가기') != 1:
                  raise SystemExit(f'{name}: expected exactly one home button, found {text.count("메인페이지로 가기")}')
              path.write_text(text, encoding='utf-8')

          print(f'Updated {len(targets)} XJTLU pages')
          PY

      - name: Validate header navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          targets = [Path('index.html'), *sorted(Path('.').glob('xjtlu-*.html'))]
          if len(targets) != 11:
              raise SystemExit(f'Expected 11 XJTLU pages, found {len(targets)}')
          for path in targets:
              text = path.read_text(encoding='utf-8')
              if text.count('메인페이지로 가기') != 1:
                  raise SystemExit(f'{path}: home button count mismatch')
              if path.name == 'index.html':
                  m = re.search(r'<ul class="nav-links">(.*?)</ul>', text, re.S)
              else:
                  m = re.search(r'<div class="navlinks">(.*?)</div>\s*</nav>', text, re.S)
              if not m:
                  raise SystemExit(f'{path}: header nav not found')
              nav = m.group(1)
              if '상담' in nav or '입학문의' in nav or nav.count('<a ') != 1:
                  raise SystemExit(f'{path}: header contains extra links')
          print('Header validation passed for all 11 pages')
          PY

      - name: Commit changes and remove helper workflow
        run: |
          rm -f .github/workflows/apply-home-only-header-20260906.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html xjtlu-*.html .github/workflows/apply-home-only-header-20260906.yml
          git commit -m "Simplify XJTLU headers to home-only navigation"
          git push origin HEAD:feature/xjtlu-campus-life-guides-20260902
