name: Alternate review and inquiry backgrounds

on:
  push:
    branches:
      - feature/xjtlu-campus-life-guides-20260902
    paths:
      - '.github/workflows/alternate-review-inquiry-backgrounds-20260906.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/xjtlu-campus-life-guides-20260902
          fetch-depth: 0

      - name: Alternate section backgrounds
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old_reviews = '<div id="reviews">'
          old_inquiry = '<div class="sec-alt" id="inquiry">'
          assert s.count(old_reviews) == 1, s.count(old_reviews)
          assert s.count(old_inquiry) == 1, s.count(old_inquiry)
          s = s.replace(old_reviews, '<div class="sec-alt" id="reviews">', 1)
          s = s.replace(old_inquiry, '<div id="inquiry">', 1)
          p.write_text(s)

      - name: Validate
        shell: bash
        run: |
          grep -q '<div class="sec-alt" id="reviews">' index.html
          grep -q '<div id="inquiry">' index.html
          if grep -q '<div class="sec-alt" id="inquiry">' index.html; then exit 1; fi

      - name: Commit changes and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/alternate-review-inquiry-backgrounds-20260906.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/alternate-review-inquiry-backgrounds-20260906.yml
          git commit -m 'Alternate review and inquiry section backgrounds'
          git push origin HEAD:feature/xjtlu-campus-life-guides-20260902
