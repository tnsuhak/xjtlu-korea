name: Cleanup XJTLU main subpage links

on:
  push:
    branches:
      - feature/xjtlu-campus-life-guides-20260902
    paths:
      - '.github/workflows/cleanup-main-subpage-links-20260906.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/xjtlu-campus-life-guides-20260902
          fetch-depth: 0

      - name: Clean main and subpage structure
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index_path = Path('index.html')
          s = index_path.read_text(encoding='utf-8')

          # 1) Desktop top menu: Student Reviews should go to the main-page review section.
          old_top = '<li><a href="xjtlu-student-videos.html">학생 후기</a></li>'
          new_top = '<li><a href="#reviews">학생 후기</a></li>'
          assert old_top in s, 'top student-review link not found'
          s = s.replace(old_top, new_top, 1)

          # 2) School introduction: add Exchange beside Dual Degree / 2+2.
          old_school = '<div class="related-links" aria-label="이 내용과 관련된 상세 가이드"><span class="related-label">관련 글</span><a class="related-link" href="xjtlu-dual-degree-liverpool-2plus2.html">복수학위·리버풀대학교 2+2<span class="arr">→</span></a></div>'
          new_school = '<div class="related-links" aria-label="이 내용과 관련된 상세 가이드"><span class="related-label">관련 글</span><a class="related-link" href="xjtlu-dual-degree-liverpool-2plus2.html">복수학위·리버풀대학교 2+2<span class="arr">→</span></a><a class="related-link" href="xjtlu-exchange.html">XJTLU 교환학생<span class="arr">→</span></a></div>'
          assert old_school in s, 'school related-links block not found'
          s = s.replace(old_school, new_school, 1)

          # 3) Admission: remove misplaced living-cost card; let English requirement span the row.
          s, n = re.subn(
              r'\n\s*<!-- 오른쪽: 04 -->\s*<div style="padding:40px 36px;">\s*<div class="adm-num">04</div>\s*<h3 class="adm-h">생활비</h3>.*?<div class="related-links" aria-label="생활비 상세 가이드">.*?</div>\s*</div>',
              '',
              s,
              count=1,
              flags=re.S,
          )
          assert n == 1, f'living-cost admission card removed {n} times'
          old_03 = '<!-- 왼쪽: 03 -->\n  <div style="padding:40px 36px;border-right:1px solid var(--rule);">'
          new_03 = '<!-- 03 -->\n  <div style="padding:40px 36px;grid-column:1/-1;">'
          assert old_03 in s, 'admission card 03 block not found'
          s = s.replace(old_03, new_03, 1)

          index_path.write_text(s, encoding='utf-8')

          # 4) Dual-degree page: remove the misplaced Liverpool Vietnam/Asia network section.
          dual_path = Path('xjtlu-dual-degree-liverpool-2plus2.html')
          d = dual_path.read_text(encoding='utf-8')
          d, n = re.subn(
              r'<section class="section"><span class="tag">LIVERPOOL GLOBAL NETWORK</span>.*?</section>\s*',
              '',
              d,
              count=1,
              flags=re.S,
          )
          assert n == 1, f'Liverpool global network section removed {n} times'
          dual_path.write_text(d, encoding='utf-8')
          PY

          # Remove obsolete generator that could recreate the deleted Vietnam page/link.
          rm -f .github/workflows/apply-liverpool-vietnam-korea-preview.yml
          rm -f scripts/add_liverpool_vietnam_korea_20260905.py

      - name: Validate cleanup
        run: |
          grep -q 'href="#reviews">학생 후기</a>' index.html
          grep -q 'href="xjtlu-dual-degree-liverpool-2plus2.html">복수학위·리버풀대학교 2+2' index.html
          grep -q 'href="xjtlu-exchange.html">XJTLU 교환학생' index.html
          grep -q '<!-- 03 -->' index.html
          if grep -q '생활비 상세 가이드' index.html; then exit 1; fi
          if grep -q 'LIVERPOOL GLOBAL NETWORK' xjtlu-dual-degree-liverpool-2plus2.html; then exit 1; fi
          if grep -q 'university-of-liverpool-vietnam.html' xjtlu-dual-degree-liverpool-2plus2.html; then exit 1; fi
          test ! -e .github/workflows/apply-liverpool-vietnam-korea-preview.yml
          test ! -e scripts/add_liverpool_vietnam_korea_20260905.py

      - name: Commit cleanup and remove helper workflow
        run: |
          rm .github/workflows/cleanup-main-subpage-links-20260906.yml
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Clean XJTLU main subpage navigation'
          git push
