name: Remove brochure-style provenance wording

on:
  push:
    branches:
      - seo/xjtlu-dual-degree-2plus2

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/xjtlu-dual-degree-2plus2
      - name: Remove brochure and recruitment-material wording
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
            'index.html': [
              ('<strong>2027 국제학생 모집자료 기준</strong> · 학비, 장학금, 지원 일정은 학교 정책과 환율에 따라 변경될 수 있습니다. 최신 기준과 지원 가능 여부는 상세 가이드와 TNS유학 상담을 통해 확인해 주세요.',
               '학비, 장학금, 지원 일정은 변경될 수 있습니다. 최신 기준과 지원 가능 여부는 상세 가이드와 TNS유학 상담을 통해 확인해 주세요.'),
              ('<p class="adm-p">2027 국제학생 모집자료 기준</p>', ''),
              ('한국 고교 내신·IELTS·해외고 2학년 진학·한국 대학 편입 기준을 2027 모집자료 기준으로 정리했습니다.',
               '한국 고교 내신·IELTS·해외고 2학년 진학·한국 대학 편입 기준을 정리했습니다.'),
              ('2027 국제학생 모집자료 기준 연간 학비는 99,000위안이며, 기숙사비는 유형에 따라 다릅니다. 얼리버드 10% 할인과 입학 장학금 최대 50%가 안내돼 있습니다.',
               '2027년 연간 학비는 99,000위안이며, 기숙사비는 유형에 따라 다릅니다. 얼리버드 10% 할인과 입학 장학금 최대 50%가 있습니다.')
            ],
            'xjtlu-admission-requirements-korea-2027.html': [
              ('2027 일정은 국제학생 모집자료 기준입니다. 전공별 조기마감과 정책 변경 가능성이 있으므로 실제 지원 직전에 다시 확인해야 합니다.',
               '전공별 조기마감이나 일정 변경이 있을 수 있으므로 실제 지원 전 최신 일정을 확인해 주세요.'),
              ('본 안내는 XJTLU 공식 국제학생 모집자료를 기준으로 작성했습니다.',
               'XJTLU 공식 입학요건과 국가별 학력 기준을 확인할 수 있습니다.')
            ],
            'xjtlu-tuition-scholarships-2027.html': [
              ('기숙사비와 예상비용을 공식 모집자료 기준으로 정리했습니다.', '기숙사비와 예상비용을 정리했습니다.'),
              ('2027 국제학생 모집자료 기준 연간 학비는 99,000위안입니다. 원화 환산액은 납부 시점의 환율에 따라 달라집니다.',
               '2027년 국제학생 연간 학비는 99,000위안입니다. 원화 환산액은 납부 시점의 환율에 따라 달라집니다.'),
              ('2027 모집자료에는 10% 얼리버드 할인이 안내돼 있으며 2027년 3월 31일까지의 지원 및 오퍼 조건을 확인해야 합니다.',
               '2027년 얼리버드 할인은 10%이며, 2027년 3월 31일까지의 지원 및 오퍼 조건을 확인해야 합니다.'),
              ('2027 국제학생 모집자료에는 최대 50% 입학 장학금이 안내돼 있습니다. 심사 결과에 따라 금액이 달라지며 신청 마감은 2027년 4월 30일로 안내돼 있습니다.',
               '2027년 입학 장학금은 최대 50%이며, 심사 결과에 따라 금액이 달라집니다. 신청 마감은 2027년 4월 30일입니다.'),
              ('2027 국제학생 모집자료 기준 연간 학비는 <strong>99,000위안</strong>입니다.',
               '2027년 국제학생 연간 학비는 <strong>99,000위안</strong>입니다.'),
              ('2027 학비·장학금·마감일은 2027 국제학생 모집자료 기준입니다. 공개 웹페이지가 다음 입학연도 기준으로 갱신되면 최신 수치를 우선 적용해야 합니다.',
               '학비·장학금·마감일은 변경될 수 있으므로 지원 시점의 최신 기준을 확인해 주세요.')
            ],
            'xjtlu-dual-degree-liverpool-2plus2.html': [
              ('<strong>비용 비교 시 주의:</strong> XJTLU 금액은 2027 국제학생 모집자료와 현재 공식 숙소 안내 기준입니다. 원화는 2026년 8월 29일 기준 참고환율(1 RMB≈204.7원, £1≈1,864원)로 단순 환산했습니다.',
               '<strong>비용 비교 시 주의:</strong> XJTLU 금액은 2027년 기준입니다. 원화는 2026년 8월 29일 기준 참고환율(1 RMB≈204.7원, £1≈1,864원)로 단순 환산했습니다.')
            ]
          }

          changed = []
          for filename, pairs in replacements.items():
              p = Path(filename)
              s = p.read_text(encoding='utf-8')
              original = s
              for old, new in pairs:
                  if old in s:
                      s = s.replace(old, new)
              if s != original:
                  p.write_text(s, encoding='utf-8')
                  changed.append(filename)

          leftovers = []
          for p in Path('.').glob('*.html'):
              s = p.read_text(encoding='utf-8')
              for term in ('브로셔', '모집자료'):
                  if term in s:
                      leftovers.append(f'{p}: {term}')
          if leftovers:
              raise SystemExit('Remaining brochure/recruitment-material wording: ' + ', '.join(leftovers))

          print('Updated:', ', '.join(changed) if changed else 'no files')
          PY
      - name: Commit changes
        run: |
          git config user.name "tnsuhak"
          git config user.email "tnsuhak@gmail.com"
          git add index.html xjtlu-admission-requirements-korea-2027.html xjtlu-tuition-scholarships-2027.html xjtlu-dual-degree-liverpool-2plus2.html
          if git diff --cached --quiet; then
            echo "No content changes"
            exit 0
          fi
          git commit -m "Remove brochure-style wording from user-facing copy"
          git push origin HEAD:seo/xjtlu-dual-degree-2plus2
