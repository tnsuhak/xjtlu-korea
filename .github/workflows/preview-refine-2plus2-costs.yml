name: Refine Liverpool cost references on 2+2 preview

on:
  push:
    branches:
      - seo/xjtlu-dual-degree-2plus2

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/xjtlu-dual-degree-2plus2
      - name: Refine cost table and Taicang programmes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('xjtlu-dual-degree-liverpool-2plus2.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
            '<strong>3·4학년은 University of Liverpool 전공별 국제학생 학비</strong><br><span style="color:var(--mid);font-size:12px;">XJTLU 2+2 학생은 Liverpool 학비 10% 할인</span>',
            '<strong>현재 공개 2026/27 기준 약 £27,000~£32,000/년</strong><br><span style="color:var(--mid);font-size:12px;">전공별 차이 · XJTLU 2+2 학생 10% 할인 시 약 £24,300~£28,800/년. 2027/28 이후 금액은 추후 공식 발표 기준</span>'
          )
          s = s.replace(
            'University of Liverpool 기숙사는 홀·객실·계약기간별 요금이 다름<br><span style="color:var(--mid);font-size:12px;">영국 이동 연도의 공식 기숙사비를 별도 확인</span>',
            '현재 공개 2026/27 39주 계약 기준 약 <strong>£4,290~£10,942</strong><br><span style="color:var(--mid);font-size:12px;">University/제휴 숙소 전체 범위 · XJTLU 학생 39주 계약 안내. 객실별 차이</span>'
          )
          s = s.replace(
            '<strong>비용 비교 시 주의:</strong> XJTLU 금액은 2027 국제학생 모집자료와 현재 공식 숙소 안내를 기준으로 표시했습니다. Liverpool의 3·4학년 학비와 기숙사비는 전공·객실·입학연도에 따라 달라지므로 이동하는 연도의 University of Liverpool 공식 금액을 기준으로 예산을 확정해야 합니다.',
            '<strong>비용 비교 시 주의:</strong> XJTLU 금액은 2027 국제학생 모집자료와 현재 공식 숙소 안내 기준입니다. Liverpool은 현재 공개된 2026/27 국제학비와 숙소비를 비교용으로 표시했으며, University of Liverpool의 2027-entry 페이지도 국제학비는 아직 2026/27 금액이라고 명시하고 있습니다. 실제 2+2 이동 시점에는 전공별 학비·기숙사비가 달라질 수 있으므로 그 해 공식 금액으로 다시 계산해야 합니다.'
          )
          s = s.replace(
            '<li>Data Science and Big Data Technology</li><li>Intelligent Manufacturing Engineering</li>',
            '<li>Data Science and Big Data Technology</li><li>Artificial Intelligence – Advanced Industrial AI</li><li>Intelligent Manufacturing Engineering</li>'
          )
          s = s.replace(
            '<a href="https://www.liverpool.ac.uk/xjtlu/courses/" target="_blank" rel="noopener" style="color:#516b8f;">전공별 연계 과정 ↗</a>',
            '<a href="https://www.liverpool.ac.uk/xjtlu/courses/" target="_blank" rel="noopener" style="color:#516b8f;">전공별 연계 과정 ↗</a> · <a href="https://www.liverpool.ac.uk/accommodation/applying/important-information/" target="_blank" rel="noopener" style="color:#516b8f;">Liverpool 숙소비 ↗</a>'
          )

          required = ['£27,000~£32,000', '£4,290~£10,942', 'Artificial Intelligence – Advanced Industrial AI']
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Missing expected updates: ' + ', '.join(missing))
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit preview changes
        run: |
          git config user.name "tnsuhak"
          git config user.email "tnsuhak@gmail.com"
          git add xjtlu-dual-degree-liverpool-2plus2.html
          if git diff --cached --quiet; then
            echo "No content changes"
            exit 0
          fi
          git commit -m "Add current Liverpool tuition and accommodation reference costs"
          git push origin HEAD:seo/xjtlu-dual-degree-2plus2
