name: Simplify degree section copy on preview

on:
  push:
    branches:
      - seo/xjtlu-dual-degree-2plus2

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/xjtlu-dual-degree-2plus2
      - name: Remove difficult wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('xjtlu-dual-degree-liverpool-2plus2.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace(' 영국 현지 2+2 이동 여부와 학위 취득 구조는 구분해서 이해해야 합니다.', '')
          s = s.replace('<p class="notice" style="margin-top:18px;">XJTLU 공식 안내는 ‘XJTLU가 학위수여 권한을 승인받은 프로그램’을 전제로 복수학위를 설명합니다. 지원하려는 전공의 공식 과정 페이지에서 학위 표시를 최종 확인해야 합니다.</p>', '')
          if '영국 현지 2+2 이동 여부와 학위 취득 구조는 구분해서 이해해야 합니다.' in s:
              raise SystemExit('first phrase still present')
          if 'XJTLU가 학위수여 권한을 승인받은 프로그램' in s:
              raise SystemExit('second phrase still present')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit preview changes
        run: |
          git config user.name "tnsuhak"
          git config user.email "tnsuhak@gmail.com"
          git add xjtlu-dual-degree-liverpool-2plus2.html
          if git diff --cached --quiet; then
            echo "No content changes"
            exit 0
          fi
          git commit -m "Simplify degree section wording"
          git push origin HEAD:seo/xjtlu-dual-degree-2plus2
