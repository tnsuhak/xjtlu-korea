name: Match UNNC video design

on:
  push:
    branches:
      - feature/xjtlu-campus-life-guides-20260902
    paths:
      - '.github/workflows/match-unnc-video-design.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/xjtlu-campus-life-guides-20260902
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Match UNNC video design
        run: python .github/scripts/match_unnc_video_design.py
      - name: Commit page change and remove helpers
        run: |
          git config user.name "tnsuhak"
          git config user.email "tnsuhak@gmail.com"
          rm -f .github/scripts/match_unnc_video_design.py .github/workflows/match-unnc-video-design.yml
          git add -A
          git commit -m "Match XJTLU sports video design to UNNC" || exit 0
          git push origin HEAD:feature/xjtlu-campus-life-guides-20260902
