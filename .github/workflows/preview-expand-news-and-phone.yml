name: Expand news articles and phone CTA in preview

on:
  push:
    branches:
      - feature/xjtlu-korea-review-news-20260830
    paths:
      - '.github/workflows/preview-expand-news-and-phone.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/xjtlu-korea-review-news-20260830

      - name: Expand news copy and add phone CTA
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          data_path = Path('news/news-data.json')
          data = json.loads(data_path.read_text(encoding='utf-8'))
          by_id = {item['id']: item for item in data['items']}

          item = by_id['class-of-2026-dual-degree-graduation']
          item['summary'] = 'XJTLU는 2026년 여름 졸업식에서 총 4,816명의 졸업을 기념했습니다. 이 가운데 학부 졸업생 3,797명은 XJTLU의 졸업·학위 증서와 영국 리버풀대학교 학사 학위 증서를 함께 받았고, 1,244명은 리버풀대학교 기준 First Class Honours로 졸업했습니다.'
          item['sections'] = [
            {
              'heading': '2026년 졸업식, 총 4,816명 졸업',
              'paragraphs': [
                'XJTLU는 2026년 7월 27일부터 31일까지 졸업식을 열고 총 4,816명의 졸업을 기념했습니다. 공식 발표에 따르면 학부 졸업생은 3,797명, 석사 졸업생은 938명, 박사 졸업생은 81명이었습니다.',
                '학부 졸업생 3,797명은 XJTLU의 졸업·학위 증서와 함께 영국 리버풀대학교의 학사 학위 증서를 받았습니다. 이 가운데 1,244명은 리버풀대학교 기준 First Class Honours로 졸업했습니다.',
                '대학원 과정에서는 석사와 박사 졸업생이 리버풀대학교 학위를 받았으며, 석사 졸업생 가운데 217명은 Distinction을 받았습니다. 학부뿐 아니라 대학원까지 XJTLU와 리버풀대학교의 학위 체계가 실제 졸업 결과에 어떻게 연결되는지 보여주는 수치입니다.'
              ]
            },
            {
              'heading': '복수학위가 실제 졸업에서 어떻게 보이는지 확인',
              'paragraphs': [
                '한국 학생과 학부모 입장에서 이번 발표에서 가장 눈에 띄는 부분은 학부 졸업생 3,797명이 두 대학의 학위 증서를 함께 받았다는 점입니다. XJTLU가 안내하는 복수학위 구조가 단순한 홍보 문구가 아니라 실제 졸업식에서 확인되는 결과라는 점을 보여줍니다.',
                'XJTLU의 2+2는 중국에서 2년, 영국 리버풀대학교에서 2년을 공부하는 학업 경로를 뜻합니다. 복수학위와 2+2는 같은 개념이 아니므로, 희망 전공이 어떤 학위를 제공하고 2+2 선택이 가능한지는 전공별로 따로 확인하는 것이 좋습니다.'
              ]
            },
            {
              'heading': '졸업 이후 진학과 취업까지 연결되는 구조',
              'paragraphs': [
                'XJTLU는 졸업생들이 대학원 진학과 취업으로 이어질 수 있도록 Career Centre, 전공 프로젝트, 산학협력과 연구 기회를 운영하고 있습니다. 이번 졸업 기사에서도 졸업 후 영국과 미국의 대학원으로 진학하는 사례와 XJTLU에서 학부와 석사를 이어서 공부한 사례가 함께 소개됐습니다.',
                '따라서 XJTLU를 비교할 때는 입학조건과 학비만 보는 것보다, 희망 전공의 복수학위 여부, 2+2 가능 여부, 졸업 후 대학원 진학과 취업 방향까지 함께 보는 편이 좋습니다. TNS유학의 복수학위·2+2 안내와 전공·진로 페이지에서 이 부분을 별도로 확인할 수 있습니다.'
              ]
            }
          ]

          item = by_id['xjtlu-seoul-suwon-un-habitat-smart-city-report']
          item['summary'] = 'XJTLU와 서울대학교가 중심이 되어 수원특례시의 스마트도시 전환을 분석한 국제 공동 보고서가 2026년 World Urban Forum 13에서 공개됐습니다. UN-Habitat, 수원시정연구원, 수원특례시가 함께 참여했으며, 스마트 기술이 실제 시민의 삶의 질과 도시 정책에 어떤 영향을 주는지를 평가하는 방법을 제시했습니다.'
          item['sections'] = [
            {
              'heading': '수원을 대상으로 한 국제 공동연구',
              'paragraphs': [
                'XJTLU는 2026년 5월 20일 World Urban Forum 13에서 도시 관련 세션을 열고 ‘Smart Inclusive Transitions for an Equitable Urban Future in Suwon’ 보고서를 공개했습니다. 이 보고서는 한국의 수원특례시를 대상으로 스마트도시 전환이 시민의 삶에 어떤 변화를 만드는지 분석한 공동연구 결과입니다.',
                '연구에는 XJTLU와 서울대학교를 중심으로 UN-Habitat의 Knowledge and Innovation Branch, 수원시정연구원, 수원특례시가 참여했습니다. 대학 연구진뿐 아니라 국제기구와 지방자치단체, 지역 연구기관이 함께 참여했다는 점이 특징입니다.'
              ]
            },
            {
              'heading': '스마트도시가 실제 삶을 개선하는지 평가',
              'paragraphs': [
                '보고서는 스마트 기술을 얼마나 많이 도입했는지만 보는 대신, 도시의 변화가 시민의 삶의 질을 실제로 개선했는지를 평가하는 데 초점을 둡니다. 연령, 성별, 거주 지역 등에 따라 도시 서비스의 효과가 다르게 나타날 수 있기 때문에 전체 평균만으로 판단하지 않고 세부 차이를 함께 살펴보는 방식입니다.',
                'XJTLU 공식 발표에 따르면 이 연구에서 사용한 SIT Framework는 평가 결과를 도시 운영에 연결하는 것을 목표로 합니다. 단순히 점수를 산출하는 데 그치지 않고 거버넌스, 예산 편성, 정책 조정과 공공서비스 설계에 활용할 수 있도록 구성됐습니다.',
                'UN-Habitat 측은 국제 도시 모니터링 데이터와 시민이 제공하는 정보, 지역 정책 데이터를 함께 연결할 수 있다는 점을 이 방법론의 중요한 특징으로 설명했습니다.'
              ]
            },
            {
              'heading': 'XJTLU Design School의 국제협력 사례',
              'paragraphs': [
                '이번 연구에는 XJTLU Department of Urban Planning and Design 연구진이 참여했습니다. 도시계획이나 건축, 지속가능한 도시 분야에 관심 있는 학생이라면 XJTLU가 수업과 연구를 중국 안에서만 진행하는 것이 아니라 한국의 대학·도시와 국제기구를 연결한 프로젝트에도 참여하고 있다는 점을 확인할 수 있습니다.',
                '공식 발표에서는 수원 보고서 이후에도 XJTLU와 UN-Habitat, 파트너 기관들이 SIT Framework를 리버풀을 포함한 다른 도시로 확대할 계획이라고 밝혔습니다. 하나의 행사성 협약보다 실제 도시를 대상으로 연구하고, 이후 다른 도시로 확장하려는 장기 협력 사례에 가깝습니다.'
              ]
            }
          ]

          item = by_id['xjtlu-pusan-national-fuel-cell-research']
          item['summary'] = 'XJTLU School of Science와 부산대학교 연구진의 공동연구가 재료·화학 분야 학술지 Small에 실렸습니다. 연구팀은 수소차 연료전지에 쓰이는 비싼 백금 기반 촉매를 대체할 가능성이 있는 코발트·탄소 복합 촉매를 이론 계산과 실험으로 함께 검증했으며, 양 대학 협력 이후 나온 첫 공동 연구 성과로 소개됐습니다.'
          item['sections'] = [
            {
              'heading': '부산대학교와의 협력이 공동 논문으로 이어졌습니다',
              'paragraphs': [
                'XJTLU School of Science와 부산대학교의 협력으로 진행된 연료전지 촉매 연구가 학술지 Small에 게재됐습니다. XJTLU는 이 연구를 양 대학이 협력 관계를 맺은 뒤 나온 첫 연구 성과로 소개했습니다.',
                '양 기관은 2023년 협력을 시작했고, 이후 재료과학과 에너지 분야를 중심으로 공동연구를 진행했습니다. 단순한 방문이나 협약 발표에서 끝난 것이 아니라 실제 연구 논문으로 결과가 이어졌다는 점이 이번 소식의 핵심입니다.'
              ]
            },
            {
              'heading': '수소차 연료전지의 비용을 낮출 가능성 연구',
              'paragraphs': [
                '수소차의 연료전지는 전기화학 반응을 통해 에너지를 만들며, 이 반응을 빠르게 하기 위해 금속과 탄소를 결합한 촉매를 사용합니다. 현재 상용 촉매에는 백금이 널리 쓰이지만 가격이 높기 때문에 더 저렴한 금속을 활용하려는 연구가 계속되고 있습니다.',
                '이번 연구에서는 백금보다 저렴한 코발트를 탄소와 결합한 복합 촉매를 다뤘습니다. XJTLU 연구진은 고전 전기역학 이론과 양자역학 계산을 결합해 코발트·탄소 구조의 성능을 설명하는 이론 모델과 예측을 만들었습니다.',
                '부산대학교 연구진은 플라즈마 합성 기술을 이용해 XJTLU의 예측을 실험으로 검증했습니다. 공식 발표는 이 공동연구에서 개발한 코발트·탄소 재료가 비교 대상으로 사용한 상용 백금 기반 재료보다 높은 성능을 보였다고 설명합니다.'
              ]
            },
            {
              'heading': '과학·재료 분야에서 확인되는 한국 연결성',
              'paragraphs': [
                '이 연구는 XJTLU가 한국 대학과 어떤 방식으로 연구 협력을 진행하는지 보여주는 사례이기도 합니다. XJTLU가 이론 계산과 모델링을 담당하고 부산대학교가 실험 기술을 활용해 검증하면서 서로 다른 연구 역량을 결합했습니다.',
                '재료과학, 화학, 에너지, 친환경 기술 분야를 생각하는 한국 학생이라면 XJTLU의 연구 환경과 한국 대학과의 연결성을 살펴볼 수 있는 사례입니다. 다만 이번 결과는 연구 단계의 성과이므로 실제 상용화 여부나 산업 적용 시점까지 의미하는 것은 아닙니다.'
              ]
            }
          ]

          data['updated_at'] = '2026-08-30'
          data_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          editorial = Path('NEWS_EDITORIAL.md')
          text = editorial.read_text(encoding='utf-8')
          text = text.replace('- `summary`: 원문을 그대로 번역하지 않은 2~3문장 요약', '- `summary`: 목록과 기사 상단에 쓰는 2~3문장 핵심 요약')
          text = text.replace('- 완전 번역이 아닌 출처 기반의 독자적인 한국어 요약을 작성한다.', '- 완전 번역이 아닌 출처 기반의 독자적인 한국어 기사로 정리한다.\n- 기사 본문은 보통 3~5개 소제목, 5~8개 문단으로 구성해 배경·핵심 내용·한국 학생에게 의미 있는 점을 충분히 설명한다.\n- 2~3문단으로 지나치게 압축한 기사보다는, 원문에서 확인되는 중요한 사실과 맥락을 빠뜨리지 않는 편집을 우선한다.\n- 목록용 `summary`는 짧게 유지하되 기사 본문까지 짧게 줄이지 않는다.')
          editorial.write_text(text, encoding='utf-8')

          renderer = Path('scripts/render_news.py')
          s = renderer.read_text(encoding='utf-8')
          s = s.replace('한국어 요약 보기 →', '기사 자세히 보기 →')
          s = s.replace('XJTLU OFFICIAL NEWS · KOREAN SUMMARY', 'XJTLU OFFICIAL NEWS · KOREAN EDITORIAL')
          s = s.replace('이 글은 XJTLU 공식 발표를 한국 독자를 위해 요약한 TNS유학의 편집 콘텐츠입니다. 원문 전체 번역이 아니며, 최종 내용은 아래 공식 출처에서 확인할 수 있습니다.', '이 글은 XJTLU 공식 발표를 한국 독자가 이해하기 쉽게 핵심 내용과 배경을 다시 정리한 TNS유학의 편집 콘텐츠입니다. 원문 전체 번역은 아니며, 최종 내용은 아래 공식 출처에서 확인할 수 있습니다.')
          s = s.replace(".btn{{display:inline-block;background:#fee500;color:#151000;text-decoration:none;font-weight:700;padding:12px 22px}}", ".btn{{display:inline-block;background:#fee500;color:#151000;text-decoration:none;font-weight:700;padding:12px 22px;margin:6px}}.btn.phone{{background:#fff;color:var(--navy)}}")
          old = '<section class="cta"><h2>XJTLU 지원 가능성 확인</h2><p style="color:rgba(255,255,255,.75)">현재 학교·성적·희망 전공을 알려주시면 지원 절차를 안내해 드립니다.</p><a class="btn" href="https://open.kakao.com/o/slehLvKi" target="_blank" rel="noopener">카카오톡 무료 상담</a></section>'
          new = '<section class="cta"><h2>XJTLU 지원 가능성 확인</h2><p style="color:rgba(255,255,255,.75)">현재 학교·성적·희망 전공을 알려주시면 지원 절차를 안내해 드립니다.</p><a class="btn" href="https://open.kakao.com/o/slehLvKi" target="_blank" rel="noopener">카카오톡 무료 상담</a><a class="btn phone" href="tel:01051500105">전화상담 010-5150-0105</a></section>'
          if old not in s:
              raise SystemExit('CTA template not found')
          s = s.replace(old, new)
          renderer.write_text(s, encoding='utf-8')
          PY

          python scripts/render_news.py
          python scripts/render_news.py --check
          git diff --check

      - name: Commit preview update and remove one-off workflow
        run: |
          git config user.name "TNS News Editorial"
          git config user.email "actions@users.noreply.github.com"
          git add NEWS_EDITORIAL.md scripts/render_news.py news/news-data.json index.html sitemap.xml news
          git rm .github/workflows/preview-expand-news-and-phone.yml
          git commit -m "Expand Korean news articles and add phone consultation"
          git push origin HEAD:feature/xjtlu-korea-review-news-20260830
