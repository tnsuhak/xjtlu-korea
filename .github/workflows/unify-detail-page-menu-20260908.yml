name: Unify XJTLU detail page menu

on:
  push:
    branches:
      - feature/xjtlu-campus-life-guides-20260902
    paths:
      - '.github/workflows/unify-detail-page-menu-20260908.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/xjtlu-campus-life-guides-20260902
          fetch-depth: 0

      - name: Replace detail-page home button with global menu
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pages = [
              'xjtlu-admission-requirements-korea-2027.html',
              'xjtlu-tuition-scholarships-2027.html',
              'xjtlu-dual-degree-liverpool-2plus2.html',
              'xjtlu-programmes-careers-graduate-destinations.html',
              'xjtlu-accommodation-sip-taicang.html',
              'xjtlu-sports-facilities.html',
              'xjtlu-clubs-student-organisations.html',
              'xjtlu-student-videos.html',
              'xjtlu-living-cost-2027.html',
              'xjtlu-exchange.html',
          ]

          css = r'''
/* TNS DETAIL GLOBAL MENU START */
.navlinks{display:flex!important;align-items:center!important;gap:0!important}
.detail-menu-btn{display:inline-flex;align-items:center;gap:8px;background:transparent;border:1px solid #d9dde6;color:var(--navy);padding:9px 13px;border-radius:4px;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:.2s}
.detail-menu-btn:hover,.detail-menu-btn[aria-expanded="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.detail-menu-icon{font-size:14px;font-weight:400;line-height:1}
.detail-site-menu{display:none;position:fixed;left:0;right:0;z-index:190;background:#fff;color:#262D40;border-top:1px solid rgba(20,33,61,.1);box-shadow:0 24px 55px rgba(10,18,34,.22);overflow-y:auto}
.detail-site-menu.open{display:block}
.detail-site-menu-inner{max-width:1200px;margin:0 auto;padding:28px 40px 34px}
.detail-site-menu-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding-bottom:18px;border-bottom:1px solid #e4e7ec;background:#fff;color:var(--navy)}
.detail-site-menu-headcopy>span{display:block;color:#9a7827;font-family:'DM Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.12em;margin-bottom:4px}
.detail-site-menu-head h2{font-family:'Noto Sans KR',sans-serif;font-size:25px;line-height:1.3;margin:0;color:var(--navy)}
.detail-site-menu-head p{margin:6px 0 0;color:#6a7283;font-size:13px}
.detail-site-menu-close{border:1px solid #d9dde6;background:#fff;color:var(--navy);width:38px;height:38px;cursor:pointer;font-size:16px;line-height:1}
.detail-site-menu-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 30px;padding-top:24px}
.detail-site-menu-group{min-width:0;padding:0;border:0}
.detail-site-menu-group h3{font-family:'Noto Sans KR',sans-serif;font-size:16px;color:var(--navy);margin:0 0 7px;border-bottom:2px solid var(--navy)}
.detail-site-menu-group h3 a{display:flex;align-items:baseline;justify-content:space-between;gap:10px;text-decoration:none;color:var(--navy);padding:0 2px 10px;font-weight:800}
.detail-site-menu-group h3 a:hover{color:#9a7827}
.detail-site-menu-group h3 small{font-family:'Noto Sans KR',sans-serif;font-size:10.5px;font-weight:700;color:#9a7827;white-space:nowrap}
.detail-site-menu-group>a{display:block;text-decoration:none;color:#4f596e;font-size:14px;padding:8px 2px;border-bottom:1px solid #eeeae1}
.detail-site-menu-group>a:hover{color:#9a7827}
.detail-site-menu-group>p{font-size:13px;line-height:1.65;color:#747c8c;margin:10px 2px 0}
.detail-site-menu-cta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.detail-site-menu-cta a{flex:1 1 120px;text-align:center;border:0;padding:10px 12px;font-weight:800;text-decoration:none}
.detail-site-menu-cta .kakao{background:#fee500;color:#161000}.detail-site-menu-cta .phone{background:var(--navy);color:#fff}
@media(max-width:820px){.navlinks{display:flex!important}.detail-menu-btn{padding:8px 11px;font-size:12px}.detail-site-menu-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.detail-site-menu-inner{padding:22px 20px 30px}}
@media(max-width:620px){.detail-site-menu-grid{grid-template-columns:1fr;gap:22px}.detail-site-menu-head h2{font-size:22px}.detail-site-menu-head p{font-size:12px}}
/* TNS DETAIL GLOBAL MENU END */
'''

          nav = '''<nav class="nav"><a class="brand" href="/">XJTLU <span>Korea</span></a><div class="navlinks"><button type="button" class="detail-menu-btn" onclick="toggleDetailSiteMenu()" aria-controls="detailSiteMenu" aria-expanded="false">전체 메뉴 <span class="detail-menu-icon">☰</span></button></div></nav>'''

          menu = '''
<div id="detailSiteMenu" class="detail-site-menu" aria-label="XJTLU Korea 전체 메뉴" aria-hidden="true">
  <div class="detail-site-menu-inner">
    <div class="detail-site-menu-head">
      <div class="detail-site-menu-headcopy"><span>XJTLU KOREA</span><h2>전체 메뉴</h2><p>메인 페이지의 주제와 관련 상세페이지를 함께 확인하세요.</p></div>
      <button type="button" class="detail-site-menu-close" onclick="closeDetailSiteMenu()" aria-label="전체 메뉴 닫기">✕</button>
    </div>
    <div class="detail-site-menu-grid">
      <section class="detail-site-menu-group"><h3><a href="/#information">학교소개 <small>메인에서 보기 →</small></a></h3><a href="xjtlu-dual-degree-liverpool-2plus2.html">리버풀대학교 복수학위·2+2</a><a href="xjtlu-exchange.html">XJTLU 교환학생</a></section>
      <section class="detail-site-menu-group"><h3><a href="/#major">전공안내 <small>메인에서 보기 →</small></a></h3><a href="xjtlu-programmes-careers-graduate-destinations.html">전공·진로·대학원 진학</a></section>
      <section class="detail-site-menu-group"><h3><a href="/#calendar">학비·장학금 <small>메인에서 보기 →</small></a></h3><a href="xjtlu-tuition-scholarships-2027.html">2027 학비·장학금</a><a href="xjtlu-living-cost-2027.html">XJTLU 생활비 2027</a></section>
      <section class="detail-site-menu-group"><h3><a href="/#rooms">숙소 <small>메인에서 보기 →</small></a></h3><a href="xjtlu-accommodation-sip-taicang.html">SIP·Taicang 숙소·기숙사</a></section>
      <section class="detail-site-menu-group"><h3><a href="/#campus-life">캠퍼스생활 <small>메인에서 보기 →</small></a></h3><a href="xjtlu-sports-facilities.html">스포츠·헬스장 시설</a><a href="xjtlu-clubs-student-organisations.html">동아리·학생단체</a></section>
      <section class="detail-site-menu-group"><h3><a href="/#admission">입학안내 <small>메인에서 보기 →</small></a></h3><a href="xjtlu-admission-requirements-korea-2027.html">2027 한국학생 입학조건·편입</a></section>
      <section class="detail-site-menu-group"><h3><a href="/#reviews">재학생후기 <small>메인에서 보기 →</small></a></h3><a href="xjtlu-student-videos.html">XJTLU 학생 후기 영상 모음</a></section>
      <section class="detail-site-menu-group"><h3><a href="/#inquiry">입학문의 <small>메인에서 보기 →</small></a></h3><p>입학조건·학비·전공·숙소 상담은 TNS유학에서 안내합니다.</p><div class="detail-site-menu-cta"><a class="kakao" href="https://open.kakao.com/o/slehLvKi" target="_blank" rel="noopener">카카오톡 상담</a><a class="phone" href="tel:01051500105">전화상담</a></div></section>
    </div>
  </div>
</div>
'''

          js = r'''
<script>
function positionDetailSiteMenu(){
  var menu=document.getElementById('detailSiteMenu');
  var nav=document.querySelector('.nav');
  if(!menu||!nav)return;
  var bottom=Math.max(0,nav.getBoundingClientRect().bottom);
  menu.style.top=bottom+'px';
  menu.style.maxHeight='calc(100vh - '+bottom+'px)';
}
function setDetailSiteMenuOpen(open){
  var menu=document.getElementById('detailSiteMenu');
  var btn=document.querySelector('.detail-menu-btn');
  if(!menu)return;
  if(open)positionDetailSiteMenu();
  menu.classList.toggle('open',open);
  menu.setAttribute('aria-hidden',open?'false':'true');
  if(btn){
    btn.setAttribute('aria-expanded',open?'true':'false');
    var icon=btn.querySelector('.detail-menu-icon');
    if(icon)icon.textContent=open?'✕':'☰';
  }
}
function toggleDetailSiteMenu(){
  var menu=document.getElementById('detailSiteMenu');
  setDetailSiteMenuOpen(!(menu&&menu.classList.contains('open')));
}
function closeDetailSiteMenu(){setDetailSiteMenuOpen(false);}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDetailSiteMenu();});
document.addEventListener('click',function(e){
  var menu=document.getElementById('detailSiteMenu');
  if(menu&&menu.classList.contains('open')&&!e.target.closest('#detailSiteMenu')&&!e.target.closest('.detail-menu-btn'))closeDetailSiteMenu();
});
window.addEventListener('resize',function(){var m=document.getElementById('detailSiteMenu');if(m&&m.classList.contains('open'))positionDetailSiteMenu();});
window.addEventListener('scroll',function(){var m=document.getElementById('detailSiteMenu');if(m&&m.classList.contains('open'))positionDetailSiteMenu();},{passive:true});
document.addEventListener('DOMContentLoaded',function(){document.querySelectorAll('#detailSiteMenu a').forEach(function(a){a.addEventListener('click',closeDetailSiteMenu)});});
</script>
'''

          old_css_re = re.compile(r'/\* TNS HOME-ONLY HEADER START \*/.*?/\* TNS HOME-ONLY HEADER END \*/\s*', re.S)
          old_nav_re = re.compile(r'<nav class="nav">\s*<a class="brand" href="/">XJTLU <span>Korea</span></a>\s*<div class="navlinks"><a class="home-only-nav" href="/">메인페이지로 가기</a></div>\s*</nav>')

          for name in pages:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              assert '메인페이지로 가기' in s, f'{name}: old home-only button missing'
              s, n_css = old_css_re.subn('', s, count=1)
              assert n_css == 1, f'{name}: old header css removed {n_css} times'
              s, n_nav = old_nav_re.subn(nav + menu, s, count=1)
              assert n_nav == 1, f'{name}: old nav replaced {n_nav} times'
              assert '</style>' in s, f'{name}: style close missing'
              s = s.replace('</style>', css + '\n</style>', 1)
              assert '</body>' in s, f'{name}: body close missing'
              s = s.replace('</body>', js + '\n</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Validate detail menus
        run: |
          python - <<'PY'
          from pathlib import Path
          pages = [
              'xjtlu-admission-requirements-korea-2027.html','xjtlu-tuition-scholarships-2027.html','xjtlu-dual-degree-liverpool-2plus2.html','xjtlu-programmes-careers-graduate-destinations.html','xjtlu-accommodation-sip-taicang.html','xjtlu-sports-facilities.html','xjtlu-clubs-student-organisations.html','xjtlu-student-videos.html','xjtlu-living-cost-2027.html','xjtlu-exchange.html'
          ]
          for name in pages:
              s=Path(name).read_text(encoding='utf-8')
              assert '메인페이지로 가기' not in s, name
              assert 'class="detail-menu-btn"' in s, name
              assert 'id="detailSiteMenu"' in s, name
              assert 'href="/#information"' in s, name
              assert 'href="/#reviews"' in s, name
              assert 'xjtlu-exchange.html' in s, name
              assert 'xjtlu-living-cost-2027.html' in s, name
              assert 'toggleDetailSiteMenu()' in s, name
          print('Validated global menu on', len(pages), 'detail pages')
          PY

      - name: Commit changes and remove helper workflow
        run: |
          rm .github/workflows/unify-detail-page-menu-20260908.yml
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Unify XJTLU detail page navigation menu'
          git push
