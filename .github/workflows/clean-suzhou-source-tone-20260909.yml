name: Clean Suzhou source tone 2026-09-09
on:
  push:
    paths:
      - '.github/workflows/clean-suzhou-source-tone-20260909.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/xjtlu-campus-life-guides-20260902
      - name: Clean visible attribution and source section
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('xjtlu-suzhou-china-life.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
            '2026년 쑤저우 산업원구 공식 자료는 쑤저우 전역에 약 900개의 한국계 기업이 진출해 있고, 5,000명이 넘는 한국 국적자가 쑤저우에서 근무·생활한다고 소개합니다. 한국기업과 교민사회가 함께 형성된 중국 도시 가운데 하나입니다.',
            '쑤저우 전역에는 약 900개의 한국계 기업이 진출해 있고, 5,000명이 넘는 한국 국적자가 근무·생활하고 있습니다. 한국기업과 교민사회가 함께 형성된 중국 도시 가운데 하나입니다.'
          )
          s = s.replace(
            'SIP 공식 자료는 삼성 계열 11개 법인을 중심으로 한국기업 클러스터가 형성돼 있다고 설명합니다. 전자·첨단제조 분야에서 한국과 쑤저우의 산업 연결성을 보여주는 대표적인 사례입니다.',
            'SIP에는 삼성 계열 11개 법인을 중심으로 한국기업 클러스터가 형성돼 있습니다. 전자·첨단제조 분야에서 한국과 쑤저우의 산업 연결성을 보여주는 대표적인 사례입니다.'
          )
          s = s.replace(
            'SK하이닉스는 쑤저우시가 아니라 인접한 우시에 대형 DRAM 생산거점을 운영합니다. 우시와 쑤저우는 같은 장쑤 남부 생활권으로 연결돼 있어 주재원 생활권이 겹치는 경우도 있습니다. 다만 쑤저우 거주 주재원 규모에 대한 공개 통계는 확인되지 않습니다.',
            'SK하이닉스는 쑤저우시가 아니라 인접한 우시에 대형 DRAM 생산거점을 운영합니다. 우시와 쑤저우는 같은 장쑤 남부 생활권으로 연결돼 있어 주재원 생활권이 겹치는 경우도 있습니다.'
          )
          s = s.replace(
            '2026년 공식 자료 기준 쑤저우에서 일하고 생활하는 한국 국적자는 5,000명이 넘습니다. 단순히 한국 식당 몇 곳이 있는 수준이 아니라 기업·학교·상공인단체·종교·문화활동이 함께 이어지는 교민사회가 형성돼 있습니다.',
            '쑤저우에서 일하고 생활하는 한국 국적자는 5,000명이 넘습니다. 단순히 한국 식당 몇 곳이 있는 수준이 아니라 기업·학교·상공인단체·종교·문화활동이 함께 이어지는 교민사회가 형성돼 있습니다.'
          )
          s = s.replace(
            '쑤저우 한국학교(Suzhou Korean School)는 2014년 개교했고 유치원부터 초·중·고 과정까지 운영합니다. 쑤저우시가 2026년 공개한 학교 안내에는 재학생 332명으로 소개돼 있습니다. 한국 주재원 가족이 장기간 생활할 수 있는 교육 인프라가 실제로 있다는 의미입니다.',
            '쑤저우 한국학교(Suzhou Korean School)는 2014년 개교했고 유치원부터 초·중·고 과정까지 운영합니다. 2026년 기준 재학생은 332명입니다. 한국 주재원 가족이 장기간 생활할 수 있는 교육 인프라가 실제로 있다는 의미입니다.'
          )

          old_lead = '<section class="section"><h2>한국에서 XJTLU까지 어떻게 가나요?</h2><p class="lead">신입생 첫 입국이라면 <strong>상하이 푸동공항(PVG)</strong>을 1순위로 권합니다. 이유는 2026-27 신입생 Pre-arrival 공식 안내에서 XJTLU의 무료 공항 픽업 장소가 상하이 푸동공항 Terminal 1·2로 명확하게 지정돼 있기 때문입니다. <strong>상하이 홍차오공항(SHA)</strong>과 <strong>우시 슈오팡공항(WUX)</strong>도 개인 이동에는 편리하지만, 현재 공개된 2026 신입생 무료 픽업 일정에는 포함돼 있지 않습니다.</p>'
          new_lead = '<section class="section"><h2>한국에서 XJTLU까지 어떻게 가나요?</h2><p class="lead">신입생 첫 입국이라면 <strong>상하이 푸동공항(PVG)</strong>을 1순위로 권합니다. 무료 공항 픽업을 이용할 수 있고, 인천·김해에서 직항편 선택도 많습니다. <strong>상하이 홍차오공항(SHA)</strong>은 김포 출발과 고속철 환승이 편리하고, <strong>우시 슈오팡공항(WUX)</strong>은 XJTLU까지의 차량 이동거리가 가장 짧습니다.</p>'
          s = s.replace(old_lead, new_lead)

          s = s.replace(
            '인천과 김해에서 상하이 푸동공항 직항편을 이용할 수 있습니다. XJTLU는 상하이 푸동공항에서 SIP 캠퍼스까지 차량으로 약 120km·2시간 정도로 안내합니다.',
            '인천과 김해에서 상하이 푸동공항 직항편을 이용할 수 있습니다. 상하이 푸동공항에서 SIP 캠퍼스까지는 차량으로 약 120km, 약 2시간 정도 걸립니다.'
          )
          s = re.sub(r'<div class="route-note"><strong>2026 신입생 무료 픽업:</strong>.*?</div>', '', s, count=1, flags=re.S)

          s = s.replace(
            '김포-상하이 홍차오 직항은 서울 도심에서 접근하기 좋고, 공항과 홍차오 고속철역이 같은 교통 허브에 있어 쑤저우행 열차로 갈아타기 편합니다. XJTLU는 상하이 홍차오공항에서 SIP 캠퍼스까지 차량으로 약 70km·1시간 정도로 안내합니다.',
            '김포-상하이 홍차오 직항은 서울 도심에서 접근하기 좋고, 공항과 상하이 홍차오 고속철역이 같은 교통 허브에 있어 쑤저우행 열차로 갈아타기 편합니다. 상하이 홍차오공항에서 SIP 캠퍼스까지는 차량으로 약 70km, 약 1시간 정도 걸립니다.'
          )
          s = s.replace('<div class="route-note">개인 이동만 놓고 보면 매우 편리한 경로입니다. 다만 2026-27 공개 신입생 픽업 안내에는 상하이 홍차오공항이 미팅포인트로 기재돼 있지 않습니다.</div>', '')

          s = s.replace(
            '인천-우시 직항을 이용하면 중국 도착 후 이동거리가 짧습니다. XJTLU는 우시공항에서 SIP 캠퍼스까지 약 50km, 택시·DiDi로 약 1시간 정도로 안내합니다.',
            '인천-우시 직항을 이용하면 중국 도착 후 이동거리가 짧습니다. 우시 슈오팡공항에서 SIP 캠퍼스까지는 약 50km로, 택시·DiDi로 약 1시간 정도 걸립니다.'
          )
          s = s.replace('<div class="route-note">한국학생에게 개인 이동은 상당히 편한 경로입니다. 다만 2026-27 공개 신입생 픽업 안내에는 우시공항이 포함돼 있지 않으므로, 학교의 무료 마중·셔틀을 원한다면 상하이 푸동공항 입국이 더 안전합니다.</div>', '')

          s = re.sub(r'<p class="notice" style="margin-top:18px"><strong>중요:</strong> 과거 XJTLU 자료에는.*?</p>', '', s, count=1, flags=re.S)
          s = re.sub(r'<section class="sources">.*?</section>\s*', '', s, count=1, flags=re.S)

          p.write_text(s, encoding='utf-8')
      - name: Validate cleanup
        shell: python
        run: |
          from pathlib import Path
          s = Path('xjtlu-suzhou-china-life.html').read_text(encoding='utf-8')
          forbidden = [
            '자료 출처',
            'Pre-arrival 공식 안내',
            '현재 공개된 2026 신입생',
            '2026 신입생 무료 픽업:',
            '공개 신입생 픽업 안내',
            '공개 통계는 확인되지 않습니다',
            '2026년 공식 자료 기준',
            '쑤저우시가 2026년 공개한 학교 안내',
            'SIP 공식 자료는',
            '2026년 쑤저우 산업원구 공식 자료는'
          ]
          bad = [x for x in forbidden if x in s]
          if bad:
            raise SystemExit('Forbidden visible attribution remains: ' + ', '.join(bad))
          assert '<strong>상하이 푸동공항(PVG)</strong>을 1순위로 권합니다.' in s
          assert '<section class="sources">' not in s
      - name: Commit cleanup and remove helper
        run: |
          git config user.name "tnsuhak"
          git config user.email "tnsuhak@gmail.com"
          git add xjtlu-suzhou-china-life.html
          git rm .github/workflows/clean-suzhou-source-tone-20260909.yml
          git commit -m "Use direct official-style voice on Suzhou guide"
          git push origin HEAD:feature/xjtlu-campus-life-guides-20260902
