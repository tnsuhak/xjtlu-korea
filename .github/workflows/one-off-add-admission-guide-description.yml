name: Add admission guide description

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/one-off-add-admission-guide-description.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add short description under admission guide link
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '<div class="source-note"><a href="xjtlu-admission-requirements-korea-2027.html"><strong>2027 입학조건·편입 상세 가이드 →</strong></a></div>'
          new = '<div class="source-note"><a href="xjtlu-admission-requirements-korea-2027.html"><strong>2027 입학조건·편입 상세 가이드 →</strong></a><br><span style="display:inline-block;margin-top:7px;font-size:12px;color:var(--mid);line-height:1.7;">한국 고교 내신·IELTS·해외고 2학년 진학·한국 대학 편입 기준을 2027 모집자료 기준으로 정리했습니다.</span></div>'
          if old not in text:
              raise SystemExit('Admission guide block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add admission guide description on homepage'
          git push
