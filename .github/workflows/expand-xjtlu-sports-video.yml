name: Expand XJTLU sports video

on:
  push:
    branches:
      - feature/xjtlu-campus-life-guides-20260902
    paths:
      - '.github/workflows/expand-xjtlu-sports-video.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/xjtlu-campus-life-guides-20260902
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Expand sports video
        run: python .github/scripts/expand_xjtlu_sports_video.py
      - name: Commit page change and remove helpers
        run: |
          git config user.name "tnsuhak"
          git config user.email "tnsuhak@gmail.com"
          rm -f .github/scripts/expand_xjtlu_sports_video.py .github/workflows/expand-xjtlu-sports-video.yml
          git add -A
          git commit -m "Expand XJTLU sports video player" || exit 0
          git push origin HEAD:feature/xjtlu-campus-life-guides-20260902
