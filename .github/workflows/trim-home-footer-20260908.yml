name: Trim XJTLU home footer

on:
  push:
    branches:
      - feature/xjtlu-campus-life-guides-20260902
    paths:
      - '.github/workflows/trim-home-footer-20260908.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/xjtlu-campus-life-guides-20260902
          fetch-depth: 0

      - name: Remove duplicate footer navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.index('    <div class="f-cols">')
          end = s.index('  <div class="fb">', start)
          s = s[:start] + '  </div>\n' + s[end:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate footer
        run: |
          if grep -q '<h4>QUICK MENU</h4>' index.html; then exit 1; fi
          if grep -q '<h4>COMMUNITY</h4>' index.html; then exit 1; fi
          grep -q '\[서울 본사\]' index.html
          grep -q '\[부산 지사\]' index.html
          grep -q 'Tel. 02-3288-1733~5' index.html
          grep -q 'Email. tns@tnsuhak.com' index.html
          grep -q 'id="floatBtns"' index.html

      - name: Commit cleanup and remove helper
        run: |
          rm .github/workflows/trim-home-footer-20260908.yml
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Simplify XJTLU homepage footer'
          git push
