name: Add SIP accommodation video

on:
  push:
    branches:
      - feature/xjtlu-campus-life-guides-20260902
    paths:
      - '.github/workflows/add-sip-accommodation-video.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/xjtlu-campus-life-guides-20260902
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Insert SIP accommodation video
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('xjtlu-accommodation-sip-taicang.html')
          s = p.read_text(encoding='utf-8')
          video_id = 'r_SJ1rLfXfk'
          marker = 'TNS SIP ACCOMMODATION VIDEO START'
          if marker in s:
              raise SystemExit('Video already present')

          css = '''
/* TNS SIP ACCOMMODATION VIDEO START */
.accom-video{margin-top:22px;background:#0e1a2e;border-radius:8px;overflow:hidden;box-shadow:0 14px 32px rgba(20,33,61,.14)}
.accom-video-copy{padding:19px 22px 15px}
.accom-video-copy .eyebrow{font-size:10px;letter-spacing:.14em}
.accom-video-copy h3{margin:5px 0 4px;color:#fff;font-size:20px}
.accom-video-copy p{margin:0;color:#cbd3df;font-size:13px;line-height:1.6}
.accom-video-frame{position:relative;padding-top:56.25%;background:#000}
.accom-video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
@media(max-width:760px){.accom-video{margin-top:16px}.accom-video-copy{padding:16px 16px 12px}.accom-video-copy h3{font-size:18px}.accom-video-copy p{font-size:12.5px}}
/* TNS SIP ACCOMMODATION VIDEO END */
'''
          if '</style>' not in s:
              raise SystemExit('No style block')
          s = s.replace('</style>', css + '\n</style>', 1)

          start = s.find('<section class="section"><h2>SIP 캠퍼스 숙소</h2>')
          if start == -1:
              raise SystemExit('SIP section not found')
          end = s.find('</section>', start)
          if end == -1:
              raise SystemExit('SIP section end not found')
          end += len('</section>')

          block = '''
<section class="section" aria-labelledby="sip-video-title">
  <div class="accom-video">
    <div class="accom-video-copy">
      <div class="eyebrow">SIP CAMPUS · ACCOMMODATION VIDEO</div>
      <h3 id="sip-video-title">SIP 캠퍼스 숙소 영상</h3>
      <p>SIP 캠퍼스 숙소의 실제 분위기를 영상으로 확인해 보세요.</p>
    </div>
    <div class="accom-video-frame">
      <iframe src="https://www.youtube.com/embed/r_SJ1rLfXfk?rel=0" title="XJTLU SIP 캠퍼스 숙소 영상" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>
  </div>
</section>'''
          s = s[:end] + block + s[end:]
          p.write_text(s, encoding='utf-8')
          print('Inserted SIP accommodation video')
          PY
      - name: Validate video embed
        run: |
          grep -q 'r_SJ1rLfXfk' xjtlu-accommodation-sip-taicang.html
          grep -q 'TNS SIP ACCOMMODATION VIDEO START' xjtlu-accommodation-sip-taicang.html
      - name: Commit and remove helper workflow
        run: |
          git config user.name "tnsuhak"
          git config user.email "tnsuhak@gmail.com"
          rm -f .github/workflows/add-sip-accommodation-video.yml
          git add -A
          git commit -m "Add SIP accommodation video" || exit 0
          git push origin HEAD:feature/xjtlu-campus-life-guides-20260902
