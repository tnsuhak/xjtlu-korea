name: Polish 2+2 FAQ in plain Korean

on:
  push:
    branches:
      - seo/xjtlu-dual-degree-2plus2

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/xjtlu-dual-degree-2plus2
      - name: Rewrite FAQ in plain Korean
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('xjtlu-dual-degree-liverpool-2plus2.html')
          s = p.read_text(encoding='utf-8')

          repl = {
            '네. 대부분의 XJTLU 학부과정은 중국에서 4년을 모두 공부해도 졸업요건을 충족하면 XJTLU 학위와 영국 리버풀대학교 학위를 함께 받습니다. 다만 전공에 따라 차이가 있을 수 있으므로 지원 전공에서 두 학위를 모두 받을 수 있는지 확인해 주세요.':
            '네. 대부분의 XJTLU 학부과정은 중국에서 4년을 공부해도 졸업하면 XJTLU 학위와 영국 리버풀대학교 학위를 함께 받을 수 있습니다. 다만 전공에 따라 다를 수 있으니 지원 전에 확인해 주세요.',

            '아니요. 교환학생처럼 한 학기나 1년만 다녀오는 과정이 아닙니다. 보통 1·2학년은 XJTLU에서 공부하고, 3·4학년은 영국 리버풀대학교에서 이어서 전공을 공부하는 방식입니다.':
            '아니요. 교환학생은 보통 한 학기나 1년 동안 다른 대학에서 공부하는 방식입니다. XJTLU 2+2는 1·2학년은 중국 XJTLU에서, 3·4학년은 영국 리버풀대학교에서 정규 학부과정을 이어서 공부하는 방식입니다.',

            '2+2 비용은 중국에서 4년 공부할 때와 같은가요?': '2+2를 하면 비용이 더 많이 드나요?',
            '아닙니다. 중국에서 공부할 때는 XJTLU 학비와 생활비가 적용되고, 영국으로 이동한 3·4학년에는 리버풀대학교 국제학생 학비와 영국 생활비를 부담합니다. 대신 XJTLU 2+2 학생은 리버풀대학교 학비 10% 할인을 받을 수 있습니다.':
            '네. 1·2학년은 XJTLU 학비와 중국 생활비가 들고, 3·4학년은 리버풀대학교 학비와 영국 생활비가 듭니다. 다만 XJTLU 2+2 학생은 리버풀대학교 학비 10% 할인을 받을 수 있습니다.',

            '희망 전공도 2+2가 가능한가요?': '내 전공도 2+2가 가능한가요?',
            '전공마다 다릅니다. XJTLU에서 선택한 전공과 리버풀대학교의 연결 전공이 있는지, 영국으로 이동하기 위해 필요한 성적이나 과목 조건이 무엇인지 확인해야 합니다. 희망 전공과 현재 학력을 알려주시면 TNS유학에서 현재 기준으로 확인해 드립니다.':
            '전공마다 다릅니다. 현재 전공이 리버풀대학교의 어떤 전공으로 이어지는지, 필요한 성적이나 과목 조건이 있는지 확인해야 합니다. 희망 전공과 현재 학력을 알려주시면 TNS유학에서 확인해 드립니다.'
          }

          for old, new in repl.items():
              if old not in s:
                  raise SystemExit('Target text not found: ' + old)
              s = s.replace(old, new)

          required = [
              '졸업하면 XJTLU 학위와 영국 리버풀대학교 학위를 함께 받을 수 있습니다',
              '교환학생은 보통 한 학기나 1년 동안 다른 대학에서 공부하는 방식입니다',
              '2+2를 하면 비용이 더 많이 드나요?',
              '내 전공도 2+2가 가능한가요?'
          ]
          for item in required:
              if item not in s:
                  raise SystemExit('Expected updated text missing: ' + item)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit preview changes
        run: |
          git config user.name "tnsuhak"
          git config user.email "tnsuhak@gmail.com"
          git add xjtlu-dual-degree-liverpool-2plus2.html
          git commit -m "Polish 2+2 FAQ for students and parents"
          git push origin HEAD:seo/xjtlu-dual-degree-2plus2
