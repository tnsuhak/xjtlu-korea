name: Remove detail word from related links
on:
  push:
    paths:
      - '.github/workflows/remove-detail-word-from-related-links-20260906.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/xjtlu-campus-life-guides-20260902
          fetch-depth: 0
      - name: Update main related-link labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '2027 학비·장학금 자세히': '2027 학비·장학금',
              'SIP·Taicang 숙소·기숙사 자세히': 'SIP·Taicang 숙소·기숙사',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected text: {old}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert '2027 학비·장학금 자세히' not in s
          assert 'SIP·Taicang 숙소·기숙사 자세히' not in s
          PY
      - name: Commit changes and remove helper workflow
        run: |
          rm .github/workflows/remove-detail-word-from-related-links-20260906.yml
          git config user.name 'tnsuhak'
          git config user.email 'tnsuhak@gmail.com'
          git add index.html .github/workflows/remove-detail-word-from-related-links-20260906.yml
          git commit -m 'Simplify main related-link labels'
          git push origin HEAD:feature/xjtlu-campus-life-guides-20260902
