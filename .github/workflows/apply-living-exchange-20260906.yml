          t = t.replace(
              'SIP 캠퍼스의 대표적인 옵션은 하루 50~102위안 수준이며, 타이창 캠퍼스는 연간 6,000위안의 2인실과 연간 14,000위안의 1인실이 안내돼 있습니다.',
              'SIP 캠퍼스의 대표적인 숙소는 장기 계약 기준 월 약 1,500~3,060위안 수준이며, 타이창 캠퍼스는 연간 6,000위안의 2인실과 연간 14,000위안의 1인실이 안내돼 있습니다.',
              1,
          )
          sip_section = '''<section class="section"><h2>SIP 캠퍼스 숙소비</h2><p class="lead">2027 안내에서는 SIP 국제학생 숙소를 월 계약 기준으로 비교할 수 있습니다. 객실 유형과 계약기간에 따라 금액이 달라질 수 있으므로 실제 예약 전 최신 공실과 계약조건을 다시 확인하세요.</p><div class="table-wrap"><table><thead><tr><th>숙소</th><th>월 비용</th><th>학교까지</th><th>주방</th><th>욕실</th></tr></thead><tbody><tr><td>Parfait International Apartments</td><td>약 1,710 RMB</td><td>약 1km</td><td>공용 주방</td><td>개인 욕실</td></tr><tr><td>Parfait Hotel &amp; Apartments</td><td>2,400~2,700 RMB</td><td>약 1km</td><td>전자레인지·냉장고</td><td>개인 욕실</td></tr><tr><td>Wenhua Apartments</td><td>1인실 1,860 RMB<br>2인 공유 시 1인 부담액 절반</td><td>약 7km</td><td>전자레인지·냉장고 설치 가능</td><td>개인 욕실</td></tr><tr><td>MBA Apartments</td><td>장기 거주 약 1,500~1,620 RMB<br>30~90일 2,220~2,340 RMB</td><td>500m 미만</td><td>취사시설 없음</td><td>공용 욕실</td></tr><tr><td>Scholar's Apartments</td><td>Studio 약 2,550~2,700 RMB<br>1 Bedroom 약 3,060 RMB</td><td>약 1km</td><td>전기제품 구입·사용 가능</td><td>개인 욕실</td></tr></tbody></table></div><p class="notice">SIP 숙소는 계약기간과 객실 배정에 따라 금액이 달라질 수 있습니다. 상세 비교는 숙소 가이드에서 확인할 수 있습니다.</p><div class="next"><a href="xjtlu-accommodation-sip-taicang.html">SIP·Taicang 숙소 상세<span>객실 유형·거리·주방·욕실 비교</span></a><a href="xjtlu-living-cost-2027.html">XJTLU 생활비 2027<span>숙소·식비·교통을 포함한 월 생활비 예산</span></a></div></section>'''
          t, n = re.subn(
              r'<section class="section"><h2>SIP 캠퍼스 기숙사비</h2>.*?</section>\s*(?=<section class="section"><h2>타이창 캠퍼스 기숙사비</h2>)',
              sip_section + '\n',
              t,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit(f'tuition SIP section replacement failed: {n}')
          tuition.write_text(t, encoding='utf-8')

          # ---------- New page: XJTLU 생활비 2027 ----------
          living = '''<!DOCTYPE html>
          <html lang="ko">
          <head>
