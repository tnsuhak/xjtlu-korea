name: Reshape XJTLU student reviews

on:
  push:
    branches:
      - feature/xjtlu-campus-life-guides-20260902
    paths:
      - '.github/workflows/reshape-student-reviews.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/xjtlu-campus-life-guides-20260902
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Keep one featured review and link video library
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'TNS STUDENT REVIEW FEATURE START'
          css = '''
          /* TNS STUDENT REVIEW FEATURE START */
          .review-feature{max-width:820px;margin-top:24px}
          .review-feature-video{position:relative;padding-top:56.25%;background:#000;overflow:hidden;box-shadow:0 10px 28px rgba(20,33,61,.12)}
          .review-feature-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
          .review-feature-caption{padding:17px 18px;background:#fff;border:1px solid #e4e7ec;border-top:0}
          .review-feature-caption strong{display:block;color:var(--navy);font-size:15px;margin-bottom:4px}
          .review-feature-caption span{display:block;color:#667085;font-size:12.5px;line-height:1.55}
          .review-library-link{position:relative;display:block;max-width:820px;margin-top:14px;padding:18px 58px 18px 18px;background:linear-gradient(135deg,#fff 0%,#fffaf0 100%);border:1px solid #dfd5b9;border-left:4px solid var(--gold);border-radius:6px;color:var(--navy);text-decoration:none;box-shadow:0 5px 16px rgba(20,33,61,.06);transition:.2s}
          .review-library-link strong{display:block;font-size:15px;font-weight:800;margin-bottom:3px}
          .review-library-link span{display:block;font-size:12px;color:#687182;font-weight:500}
          .review-library-link::after{content:'→';position:absolute;right:16px;top:50%;transform:translateY(-50%);width:31px;height:31px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--navy);color:#fff;font-size:17px;font-weight:800;box-shadow:0 4px 10px rgba(20,33,61,.16)}
          .review-library-link:hover,.review-library-link:focus-visible{transform:translateY(-2px);border-color:var(--gold);box-shadow:0 10px 24px rgba(20,33,61,.11);outline:none}
          @media(max-width:760px){.review-feature{margin-top:20px}.review-feature-caption{padding:14px 15px}.review-library-link{padding:16px 53px 16px 15px}.review-library-link::after{right:13px;width:30px;height:30px}}
          /* TNS STUDENT REVIEW FEATURE END */
          '''
          css = '\n'.join(line[10:] if line.startswith('          ') else line for line in css.splitlines())
          if marker not in s:
              if '</style>' not in s:
                  raise SystemExit('No style block found')
              s = s.replace('</style>', css + '\n</style>', 1)
          start_marker = '<!-- ====== 재학생후기 ====== -->'
          end_marker = '<!-- ====== 입학문의 ====== -->'
          start = s.find(start_marker)
          end = s.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('Student review section markers not found')
          review = '''<!-- ====== 재학생후기 ====== -->
          <div id="reviews">
            <div class="sec fi">
              <p class="label">STUDENT REVIEWS</p>
              <h2 class="sec-h">재학생후기</h2>
              <p class="sec-p">메인에서는 대표 학생 인터뷰 1개만 먼저 보여드립니다. 더 많은 XJTLU 재학생 인터뷰와 전공·진로 이야기는 후기 영상 모음에서 확인하세요.</p>
              <div class="review-feature">
                <div class="review-feature-video">
                  <iframe src="https://www.youtube-nocookie.com/embed/c2h3t771rVk?rel=0" title="XJTLU 한인 학생회장 인터뷰" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                </div>
                <div class="review-feature-caption"><strong>XJTLU 한인 학생회장 인터뷰</strong><span>한국 재학생이 직접 전하는 XJTLU 대학생활을 영상으로 확인해 보세요.</span></div>
              </div>
              <a class="review-library-link" href="xjtlu-student-videos.html"><strong>XJTLU 학생 후기 영상 모음</strong><span>재학생 인터뷰 · 전공 및 진로 선택 후기 전체 보기</span></a>
            </div>
          </div>
          '''
          review = '\n'.join(line[10:] if line.startswith('          ') else line for line in review.splitlines()) + '\n\n'
          s = s[:start] + review + s[end:]
          mobile_anchor = '  <a class="mob-detail" href="xjtlu-clubs-student-organisations.html">동아리·학생단체</a>'
          mobile_link = '  <a class="mob-detail" href="xjtlu-student-videos.html">학생 후기 영상 모음</a>'
          if mobile_link not in s:
              if mobile_anchor not in s:
                  raise SystemExit('Mobile menu anchor not found')
              s = s.replace(mobile_anchor, mobile_anchor + '\n' + mobile_link, 1)
          old_group = '<section class="site-menu-group"><h3><a href="#reviews">재학생후기 <small>메인에서 보기 →</small></a></h3><p>한국 학생 인터뷰와 전공·진로 선택 후기를 메인에서 영상으로 확인합니다.</p></section>'
          new_group = '<section class="site-menu-group"><h3><a href="#reviews">재학생후기 <small>메인에서 보기 →</small></a></h3><a href="xjtlu-student-videos.html">XJTLU 학생 후기 영상 모음</a><p>대표 영상은 메인에서, 재학생 인터뷰 전체는 후기 영상 모음에서 확인합니다.</p></section>'
          if old_group in s:
              s = s.replace(old_group, new_group, 1)
          elif 'href="xjtlu-student-videos.html">XJTLU 학생 후기 영상 모음</a><p>대표 영상은 메인에서' not in s:
              raise SystemExit('Site menu review group not found')
          footer_old = '<li><a href="#reviews">재학생후기</a></li>'
          footer_new = '<li><a href="xjtlu-student-videos.html">학생 후기 영상</a></li>'
          if footer_old in s:
              s = s.replace(footer_old, footer_new, 1)
          p.write_text(s, encoding='utf-8')
          print('Homepage student reviews reshaped')
          PY
      - name: Validate homepage review hierarchy
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          a = s.index('<!-- ====== 재학생후기 ====== -->')
          b = s.index('<!-- ====== 입학문의 ====== -->', a)
          chunk = s[a:b]
          assert 'c2h3t771rVk' in chunk
          assert '6eHbOLJ4ERg' not in chunk
          assert '9iGRC82D3G0' not in chunk
          assert 'xjtlu-student-videos.html' in chunk
          assert s.count('xjtlu-student-videos.html') >= 4
          assert 'TNS STUDENT REVIEW FEATURE START' in s
          print('Validated one featured homepage video and student video library links')
          PY
      - name: Commit homepage update and remove helper workflow
        run: |
          git config user.name "tnsuhak"
          git config user.email "tnsuhak@gmail.com"
          rm -f .github/workflows/reshape-student-reviews.yml
          git add -A
          git commit -m "Feature one student review and link video library" || exit 0
          git push origin HEAD:feature/xjtlu-campus-life-guides-20260902
