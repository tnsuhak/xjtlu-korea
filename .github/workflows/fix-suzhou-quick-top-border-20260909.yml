name: Fix Suzhou mobile summary border 2026-09-09
on:
  push:
    paths:
      - '.github/workflows/fix-suzhou-quick-top-border-20260909.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/xjtlu-campus-life-guides-20260902
      - name: Add mobile separation above summary boxes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('xjtlu-suzhou-china-life.html')
          s = p.read_text(encoding='utf-8')
          old = "@media(max-width:760px){.hero{min-height:350px}.quick{grid-template-columns:1fr 1fr;margin-top:0}"
          new = "@media(max-width:760px){.hero{min-height:350px}.quick{grid-template-columns:1fr 1fr;margin-top:12px;border-top:1px solid #d9dde6}"
          if old not in s:
              raise SystemExit('target mobile quick rule not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate
        run: |
          grep -F 'margin-top:12px;border-top:1px solid #d9dde6' xjtlu-suzhou-china-life.html
      - name: Commit update and remove helper
        run: |
          git config user.name 'tnsuhak'
          git config user.email 'tnsuhak@gmail.com'
          git rm .github/workflows/fix-suzhou-quick-top-border-20260909.yml
          git add xjtlu-suzhou-china-life.html
          git commit -m 'Separate Suzhou mobile summary from hero'
          git push origin HEAD:feature/xjtlu-campus-life-guides-20260902
