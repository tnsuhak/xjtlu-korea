name: Remove misplaced Liverpool Vietnam page

on:
  push:
    branches:
      - feature/xjtlu-campus-life-guides-20260902

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/xjtlu-campus-life-guides-20260902
          fetch-depth: 0

      - name: Remove misplaced page and links
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          sitemap = Path('sitemap.xml')
          wrong_page = Path('university-of-liverpool-vietnam.html')

          s = index.read_text(encoding='utf-8')
          targets = [
              '<a class="mob-detail" href="university-of-liverpool-vietnam.html">리버풀대학교 베트남·아시아 네트워크</a>\n',
              '<a href="university-of-liverpool-vietnam.html">리버풀대학교 베트남·아시아 네트워크</a>',
              '<a class="related-link" href="university-of-liverpool-vietnam.html">리버풀대학교의 베트남·아시아 네트워크<span class="arr">→</span></a>',
          ]
          for target in targets:
              s = s.replace(target, '')
          if 'university-of-liverpool-vietnam.html' in s or '리버풀대학교의 베트남·아시아 네트워크' in s:
              raise SystemExit('index cleanup incomplete')
          index.write_text(s, encoding='utf-8')

          sm = sitemap.read_text(encoding='utf-8')
          block = '''  <url>\n    <loc>https://xjtlu-korea.netlify.app/university-of-liverpool-vietnam.html</loc>\n    <lastmod>2026-09-05</lastmod>\n  </url>\n'''
          sm = sm.replace(block, '')
          if 'university-of-liverpool-vietnam.html' in sm:
              raise SystemExit('sitemap cleanup incomplete')
          sitemap.write_text(sm, encoding='utf-8')

          if wrong_page.exists():
              wrong_page.unlink()

          print('Removed misplaced Liverpool Vietnam page and all XJTLU Korea links')
          PY

      - name: Commit cleanup and remove helper workflow
        run: |
          rm -f .github/workflows/remove-misplaced-liverpool-vietnam-20260906.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml university-of-liverpool-vietnam.html .github/workflows/remove-misplaced-liverpool-vietnam-20260906.yml
          git diff --cached --quiet && exit 0
          git commit -m "Remove misplaced Liverpool Vietnam content"
          git push origin HEAD:feature/xjtlu-campus-life-guides-20260902
