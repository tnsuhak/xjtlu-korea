name: Update Suzhou Korea community and airport guide
on:
  push:
    branches: [feature/xjtlu-campus-life-guides-20260902]
    paths: ['.github/workflows/update-suzhou-korean-community-airport-20260909.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/xjtlu-campus-life-guides-20260902
      - name: Update Suzhou guide
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('xjtlu-suzhou-china-life.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('XJTLU가 위치한 쑤저우를 한국학생 관점에서 소개합니다. 1,300만 명 규모의 도시, 상하이 접근성, 한국기업과 한중 경제관계, SIP 한국생활권, 인천-우시·김포-홍차오 항공편과 실제 유학생활을 정리했습니다.','XJTLU가 위치한 쑤저우를 한국학생 관점에서 소개합니다. 1,300만 명 규모의 도시, 상하이 접근성, 약 900개 한국계 기업과 5,000명 이상의 한국인 커뮤니티, 쑤저우 한국학교, SK하이닉스 우시 거점, 상하이 푸동·홍차오·우시 공항 이동을 정리했습니다.')
          s=s.replace('<div class="wrap quick"><div><b>1,304.8만 명</b><span>2025년 말 쑤저우 상주인구</span></div><div><b>약 30분 안팎</b><span>쑤저우 ↔ 상하이 고속철</span></div><div><b>327개</b><span>SIP 한국기업 누적 투자 · 2025년 말</span></div><div><b>인천 ↔ 우시</b><span>한국에서 이용 가능한 직항 경로</span></div></div>','<div class="wrap quick"><div><b>1,304.8만 명</b><span>2025년 말 쑤저우 상주인구</span></div><div><b>약 30분 안팎</b><span>쑤저우 ↔ 상하이 고속철</span></div><div><b>약 900개</b><span>쑤저우 한국계 기업 · 2026</span></div><div><b>5,000명+</b><span>쑤저우 거주·근무 한국 국적자</span></div></div>')

          def replace_section(title,new_html):
              global s
              pat=rf'<section class="section"><h2>{re.escape(title)}</h2>.*?</section>'
              s2,n=re.subn(pat,new_html,s,count=1,flags=re.S)
              if n!=1: raise SystemExit(f'section not found or duplicate: {title} ({n})')
              s=s2

          replace_section('한국과 생각보다 훨씬 가까운 도시','''<section class="section"><h2>한국과 생각보다 훨씬 가까운 도시</h2><p class="lead">쑤저우와 한국의 관계는 단순한 관광교류 수준이 아닙니다. 쑤저우시는 1996년부터 전주시와 자매도시 관계를 이어오고 있고, 2026년 현재 쑤저우에는 약 900개의 한국계 기업과 5,000명이 넘는 한국 국적자가 근무·생활하고 있습니다.</p><div class="grid"><article class="card"><h3>전주시와 30년 가까운 교류</h3><p>쑤저우와 전주는 1996년 3월 자매도시 관계를 맺었습니다. 문화·교육·스포츠 등 여러 분야에서 교류가 이어져 왔고, 쑤저우 안에서도 한국은 익숙한 해외 파트너로 인식됩니다.</p></article><article class="card"><h3>쑤저우 전체 약 900개 한국계 기업</h3><p>2026년 쑤저우 산업원구 공식 자료는 쑤저우 전역에 약 900개의 한국계 기업이 진출해 있고, 5,000명이 넘는 한국 국적자가 쑤저우에서 근무·생활한다고 소개합니다. 한국기업과 교민사회가 함께 형성된 중국 도시 가운데 하나입니다.</p></article><article class="card"><h3>SIP만 봐도 한국기업 327개</h3><p>2025년 말까지 XJTLU가 위치한 SIP에 투자한 한국기업은 누적 327개로 집계됐습니다. 2025년 SIP와 한국의 교역액은 275.8억 달러였고, 한국은 SIP의 제1 교역 파트너였습니다.</p></article><article class="card"><h3>한국학생에게 낯설지 않은 생활환경</h3><p>한국기업 주재원과 가족, 한국학교, 한인 상권과 커뮤니티가 오랫동안 자리 잡아 중국 생활을 처음 시작하는 한국학생도 한식·한국어 서비스·교민 네트워크를 비교적 쉽게 접할 수 있습니다.</p></article></div></section>''')

          replace_section('어떤 한국기업들이 있나요?','''<section class="section"><h2>어떤 한국기업들이 있나요?</h2><p class="lead">SIP는 한국기업의 중국 진출 거점 가운데 하나이고, 인접한 우시까지 넓혀 보면 장쑤 남부는 한국 제조·반도체 기업의 중요한 산업권입니다. 중국 비즈니스나 아시아 커리어에 관심 있는 학생이라면 도시 자체가 하나의 현장학습 환경이 됩니다.</p><div class="grid"><article class="card"><h3>삼성 계열</h3><p>SIP 공식 자료는 삼성 계열 11개 법인을 중심으로 한국기업 클러스터가 형성돼 있다고 설명합니다. 전자·첨단제조 분야에서 한국과 쑤저우의 산업 연결성을 보여주는 대표적인 사례입니다.</p></article><article class="card"><h3>두산·코오롱 등 제조업</h3><p>두산과 코오롱을 비롯한 한국 제조기업들이 SIP에 진출해 있습니다. 최근에는 반도체 소재, 의료·헬스케어, 스마트 장비 분야의 한국 프로젝트도 이어지고 있습니다.</p></article><article class="card"><h3>우리·IBK·KB 등 금융</h3><p>우리은행, IBK기업은행, KB국민은행과 삼성계 보험사 등 한국계 금융기관도 자리하고 있어 한국기업과 주재원 커뮤니티를 뒷받침합니다.</p></article><article class="card"><h3>인접 우시의 SK하이닉스</h3><p>SK하이닉스는 쑤저우시가 아니라 인접한 우시에 대형 DRAM 생산거점을 운영합니다. 우시와 쑤저우는 같은 장쑤 남부 생활권으로 연결돼 있어 주재원 생활권이 겹치는 경우도 있습니다. 다만 쑤저우 거주 주재원 규모에 대한 공개 통계는 확인되지 않습니다.</p></article></div><div class="notice" style="margin-top:18px"><strong>취업과 연결해서 보면:</strong> 한국기업이 많다고 해서 취업이나 인턴십이 자동으로 보장되는 것은 아닙니다. 다만 중국어·영어와 함께 중국의 산업현장을 실제로 경험하고, 한중 비즈니스가 어떻게 연결되는지 가까이서 볼 수 있다는 점은 분명한 장점입니다.</div></section>''')

          marker='<section class="section"><h2>쑤저우에도 ‘코리아타운’이 있나요?</h2>'
          community='''<section class="section"><h2>5,000명 넘는 한국인이 만드는 교민사회</h2><p class="lead">2026년 공식 자료 기준 쑤저우에서 일하고 생활하는 한국 국적자는 5,000명이 넘습니다. 단순히 한국 식당 몇 곳이 있는 수준이 아니라 기업·학교·상공인단체·종교·문화활동이 함께 이어지는 교민사회가 형성돼 있습니다.</p><div class="grid"><article class="card"><h3>쑤저우 한국학교</h3><p>쑤저우 한국학교(Suzhou Korean School)는 2014년 개교했고 유치원부터 초·중·고 과정까지 운영합니다. 쑤저우시가 2026년 공개한 학교 안내에는 재학생 332명으로 소개돼 있습니다. 한국 주재원 가족이 장기간 생활할 수 있는 교육 인프라가 실제로 있다는 의미입니다.</p></article><article class="card"><h3>쑤저우 한국상회·한국인회</h3><p>쑤저우 한국상회와 한국인 커뮤니티는 기업 교류뿐 아니라 금계호 걷기행사 같은 한중 교류행사도 운영합니다. 2026년 행사에는 한국인·한국기업 관계자와 쑤저우 시민 600여 명이 참여했습니다.</p></article><article class="card"><h3>한국어 종교·생활 커뮤니티</h3><p>소주우장한인교회처럼 한국어로 예배하고 교제하는 한인 공동체도 현재 활동하고 있습니다. 종교 여부와 관계없이 이런 조직이 존재한다는 점은 쑤저우에 가족 단위 한국 교민층이 장기간 자리 잡고 있다는 생활 인프라의 한 사례입니다.</p></article><article class="card"><h3>학생에게 의미하는 것</h3><p>XJTLU 학생이 교민사회에 의존해서 생활해야 한다는 뜻은 아닙니다. 오히려 중국 현지생활을 경험하면서도 필요할 때 한식·한국어 서비스·한국인 네트워크를 이용할 수 있다는 안전판에 가깝습니다.</p></article></div></section>\n\n'''
          if marker not in s: raise SystemExit('Koreatown marker not found')
          s=s.replace(marker,community+marker,1)

          replace_section('한국에서 XJTLU까지 어떻게 가나요?','''<section class="section"><h2>한국에서 XJTLU까지 어떻게 가나요?</h2><p class="lead">신입생 첫 입국이라면 <strong>상하이 푸동공항(PVG)</strong>을 1순위로 권합니다. 이유는 2026-27 신입생 Pre-arrival 공식 안내에서 XJTLU의 무료 공항 픽업 장소가 상하이 푸동공항 Terminal 1·2로 명확하게 지정돼 있기 때문입니다. <strong>상하이 홍차오공항(SHA)</strong>과 <strong>우시 슈오팡공항(WUX)</strong>도 개인 이동에는 편리하지만, 현재 공개된 2026 신입생 무료 픽업 일정에는 포함돼 있지 않습니다.</p><div class="route-grid"><article class="route-card"><span class="route-no">ROUTE 01 · 신입생 첫 입국 추천</span><h3>인천·김해 → 상하이 푸동 → XJTLU</h3><p><strong>인천(ICN) / 김해(PUS) → 상하이 푸동공항(PVG) → XJTLU SIP</strong></p><p>인천과 김해에서 상하이 푸동공항 직항편을 이용할 수 있습니다. XJTLU는 상하이 푸동공항에서 SIP 캠퍼스까지 차량으로 약 120km·2시간 정도로 안내합니다.</p><div class="route-note"><strong>2026 신입생 무료 픽업:</strong> X1 비자 학생 8월 25~28일, X2 및 홍콩·마카오·대만 학생 8월 30일~9월 1일. SIP행 마지막 버스는 17:00이며 15:30 이전 도착이 요구됩니다. Application System에서 사전 예약해야 하고 미팅포인트는 상하이 푸동공항 T1·T2입니다. 2027 입학생은 새 학년도 안내를 다시 확인하세요.</div></article><article class="route-card"><span class="route-no">ROUTE 02 · 김포 이용</span><h3>김포 → 상하이 홍차오 → 쑤저우</h3><p><strong>김포(GMP) → 상하이 홍차오공항(SHA) → 상하이 홍차오역 → 쑤저우</strong></p><p>김포-상하이 홍차오 직항은 서울 도심에서 접근하기 좋고, 공항과 홍차오 고속철역이 같은 교통 허브에 있어 쑤저우행 열차로 갈아타기 편합니다. XJTLU는 상하이 홍차오공항에서 SIP 캠퍼스까지 차량으로 약 70km·1시간 정도로 안내합니다.</p><div class="route-note">개인 이동만 놓고 보면 매우 편리한 경로입니다. 다만 2026-27 공개 신입생 픽업 안내에는 상하이 홍차오공항이 미팅포인트로 기재돼 있지 않습니다.</div></article><article class="route-card"><span class="route-no">ROUTE 03 · XJTLU와 가장 가까운 공항</span><h3>인천 → 우시 → XJTLU</h3><p><strong>인천(ICN) → 우시 슈오팡공항(WUX) → XJTLU SIP</strong></p><p>인천-우시 직항을 이용하면 중국 도착 후 이동거리가 짧습니다. XJTLU는 우시공항에서 SIP 캠퍼스까지 약 50km, 택시·DiDi로 약 1시간 정도로 안내합니다.</p><div class="route-note">한국학생에게 개인 이동은 상당히 편한 경로입니다. 다만 2026-27 공개 신입생 픽업 안내에는 우시공항이 포함돼 있지 않으므로, 학교의 무료 마중·셔틀을 원한다면 상하이 푸동공항 입국이 더 안전합니다.</div></article></div><p class="notice" style="margin-top:18px"><strong>중요:</strong> 과거 XJTLU 자료에는 상하이 푸동·상하이 홍차오·우시에서 Airport Meet-and-Greet를 운영한 기록이 있지만, 현재 공개된 2026-27 Pre-arrival 안내는 <strong>상하이 푸동공항 T1·T2</strong>만 지정합니다. 공항 픽업 운영은 학년도마다 달라질 수 있으므로 출국 전 해당 연도의 Pre-arrival 안내와 Application System 예약 화면을 다시 확인하세요.</p></section>''')

          s=s.replace('우시공항뿐 아니라 홍차오·푸동공항까지 활용할 수 있어 방학 귀국이나 해외여행 때 항공편 선택폭이 커집니다.','우시공항뿐 아니라 상하이 홍차오공항·상하이 푸동공항까지 활용할 수 있어 방학 귀국이나 해외여행 때 항공편 선택폭이 커집니다.')
          s=s.replace('삼성·두산·코오롱 등 한국계 기업과 글로벌 제조·바이오·반도체 기업이 밀집한 지역에서 생활한다는 점은 경영·경제·공학 학생에게 특히 의미가 있습니다.','삼성·두산·코오롱 등 쑤저우의 한국계 기업뿐 아니라 인접 우시의 SK하이닉스 같은 대형 반도체 거점까지 가까운 장쑤 남부 산업권에서 생활한다는 점은 경영·경제·공학 학생에게 특히 의미가 있습니다.')

          sources='''<section class="sources"><p><strong>자료 출처</strong> · <a href="https://www.suzhou.gov.cn/szsrmzf/ndgmjjhshfztjsjfb/202605/0543af82405748cd9ffa4cfc81aecccd.shtml" target="_blank" rel="noopener">쑤저우 2025 통계공보 ↗</a> · <a href="https://www.sipac.gov.cn/szgyyq/mtjj/202603/17632addc0464218ac20dc778d92d941.shtml" target="_blank" rel="noopener">쑤저우 한국기업·한국인 현황 ↗</a> · <a href="https://english.suzhou.gov.cn/szsenglish/szwjryznxx/202602/93761db9b5d14faeb4cb0eeb8d93772c.shtml" target="_blank" rel="noopener">쑤저우 한국학교 ↗</a> · <a href="https://www.xjtlu.edu.cn/en/admissions/pre-arrival-information" target="_blank" rel="noopener">XJTLU 신입생 공항 픽업 안내 ↗</a> · <a href="https://www.xjtlu.edu.cn/en/campus-life/visit-us" target="_blank" rel="noopener">XJTLU 캠퍼스 교통 안내 ↗</a> · <a href="https://www.skhynix.com/company/UI-FR-CP06/" target="_blank" rel="noopener">SK하이닉스 우시 사업장 ↗</a> · <a href="https://www.szwjch.com/" target="_blank" rel="noopener">소주우장한인교회 ↗</a><br>항공편과 대학 픽업 일정은 학년도·시즌별로 변경될 수 있습니다. SK하이닉스 우시 근무자의 쑤저우 거주 규모는 공개 통계가 없어 수치화하지 않았습니다.</p></section>'''
          s2,n=re.subn(r'<section class="sources">.*?</section>',sources,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'sources replace failed {n}')
          s=s2

          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate key updates
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('xjtlu-suzhou-china-life.html').read_text(encoding='utf-8')
