name: Fix living cost mobile separator
on:
  push:
    branches:
      - feature/xjtlu-campus-life-guides-20260902
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/xjtlu-campus-life-guides-20260902
          fetch-depth: 0
      - name: Add mobile separation above first budget card
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('xjtlu-living-cost-2027.html')
          s = p.read_text(encoding='utf-8')
          old = "@media(max-width:760px){.navlinks{display:none}.hero{min-height:330px}.quick{grid-template-columns:1fr;margin-top:0}"
          new = "@media(max-width:760px){.navlinks{display:none}.hero{min-height:330px}.quick{grid-template-columns:1fr;margin-top:12px;border-top:1px solid var(--rule)}"
          if old not in s:
              raise SystemExit('Target mobile quick rule not found')
          s = s.replace(old, new, 1)
          s = s.replace('"dateModified":"2026-09-08"', '"dateModified":"2026-09-09"', 1)
          p.write_text(s, encoding='utf-8')

          sm = Path('sitemap.xml')
          t = sm.read_text(encoding='utf-8')
          target = '''<loc>https://xjtlu-korea.netlify.app/xjtlu-living-cost-2027.html</loc>\n    <lastmod>2026-09-08</lastmod>'''
          repl = '''<loc>https://xjtlu-korea.netlify.app/xjtlu-living-cost-2027.html</loc>\n    <lastmod>2026-09-09</lastmod>'''
          if target in t:
              t = t.replace(target, repl, 1)
          sm.write_text(t, encoding='utf-8')
          PY
      - name: Validate
        run: |
          grep -F 'margin-top:12px;border-top:1px solid var(--rule)' xjtlu-living-cost-2027.html
          grep -A1 'xjtlu-living-cost-2027.html' sitemap.xml | grep '2026-09-09'
      - name: Commit and remove helper
        run: |
          rm -f .github/workflows/fix-living-cost-mobile-separator-20260909.yml
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Separate living cost summary from hero on mobile'
          git push
