name: Localize university ranking label in preview

on:
  push:
    branches:
      - seo/xjtlu-programmes-careers

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/xjtlu-programmes-careers
      - name: Update ranking label and tied-rank notation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('xjtlu-programmes-careers-graduate-destinations.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<th>2027 QS</th>', '<th>세계대학 순위<br><span style="font-size:11px;font-weight:500;opacity:.78;">(2027 QS)</span></th>')
          # Convert only the final ranking cell in each table row.
          s=re.sub(r'<td>=(\d+)</td></tr>', lambda m: f'<td>공동 {m.group(1)}위</td></tr>', s)
          s=re.sub(r'<td>(\d+)</td></tr>', lambda m: f'<td>{m.group(1)}위</td></tr>', s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('xjtlu-programmes-careers-graduate-destinations.html').read_text(encoding='utf-8')
          assert '세계대학 순위<br>' in s
          assert '(2027 QS)' in s
          assert '공동 2위' in s
          assert '<th>2027 QS</th>' not in s
          print('Ranking label localization verified')
          PY
          git config user.name "tnsuhak"
          git config user.email "tnsuhak@gmail.com"
          git add xjtlu-programmes-careers-graduate-destinations.html
          git rm .github/workflows/preview-localize-ranking-label.yml
          git commit -m "Clarify world university ranking labels"
          git push origin HEAD:seo/xjtlu-programmes-careers
