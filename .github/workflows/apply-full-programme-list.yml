name: Replace XJTLU programme overview with full list

on:
  push:
    branches:
      - feature/xjtlu-campus-life-guides-20260902
    paths:
      - '.github/workflows/apply-full-programme-list.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/xjtlu-campus-life-guides-20260902
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Replace programme overview with all 51 undergraduate programmes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, html

          p = Path('xjtlu-programmes-careers-graduate-destinations.html')
          s = p.read_text(encoding='utf-8')

          raw = '''Accounting|BA (Hons)
          Actuarial Science|BSc (Hons)
          Applied Chemistry|BSc (Hons)
          Applied Linguistics|BA (Hons)
          Applied Mathematics|BSc (Hons)
          Applied Physics|BSc (Hons)
          Architecture|BEng (Hons)
          Artificial Intelligence|BEng (Hons)
          Arts, Technology and Entertainment with Contemporary Entrepreneurialism|BA (Hons)
          Bioinformatics|BSc (Hons)
          Biological Sciences|BSc (Hons)
          Biomedical Sciences|BSc (Hons)
          Biomedical Statistics|BSc (Hons)
          Biopharmaceuticals|BSc (Hons)
          Business Administration|BA (Hons)
          China Studies|BA (Hons)
          Civil Engineering|BEng (Hons)
          Computer Science and Technology|BEng (Hons)
          Data Science and Big Data Technology with Contemporary Entrepreneurialism|BEng (Hons)
          Digital and Intelligent Marketing|BA (Hons)
          Digital Media Arts|BA (Hons)
          Digital Media Technology|BEng (Hons)
          Economics|BSc (Hons)
          Economics and Finance|BSc (Hons)
          Electrical Engineering|BEng (Hons)
          Electronic Science and Technology|BEng (Hons)
          English and Business|BA (Hons)
          English and Communication Studies|BA (Hons)
          English Studies in Global Context|BA (Hons)
          Environmental Science|BSc (Hons)
          Filmmaking|BA (Hons)
          Financial Mathematics|BSc (Hons)
          Human Resource Management and People Analytics|BA (Hons)
          Industrial Design|BEng (Hons)
          Information and Computing Science|BSc (Hons)
          Information Management and Information Systems|BSc (Hons)
          Intelligent Manufacturing Engineering with Contemporary Entrepreneurialism|BEng (Hons)
          Intelligent Robotics Engineering with Contemporary Entrepreneurialism|BEng (Hons)
          Intelligent Supply Chain with Contemporary Entrepreneurialism|BSc (Hons)
          International Business with a Language|BA (Hons)
          International Relations|BA (Hons)
          Internet of Things Engineering with Contemporary Entrepreneurialism|BEng (Hons)
          Materials Science and Engineering|BEng (Hons)
          Mechatronics and Robotic Systems|BEng (Hons)
          Media and Communication Studies|BA (Hons)
          Microelectronic Science and Engineering with Contemporary Entrepreneurialism|BEng (Hons)
          Pharmaceutical Sciences|BSc (Hons)
          Telecommunications Engineering|BEng (Hons)
          Translation and Interpreting|BA (Hons)
          TV Production|BA (Hons)
          Urban Planning and Design|BA (Hons)'''

          programmes = []
          for line in raw.splitlines():
              line = line.strip()
              if not line:
                  continue
              name, degree = line.rsplit('|', 1)
              programmes.append((name.strip(), degree.strip()))
          assert len(programmes) == 51

          items = '\n'.join(
              f'<li><span class="programme-name">{html.escape(name)}</span><span class="programme-degree">{html.escape(degree)}</span></li>'
              for name, degree in programmes
          )

          replacement = f'''<section class="section programme-section">
          <div class="programme-heading">
            <div>
              <span class="tag">UNDERGRADUATE PROGRAMMES</span>
              <h2>XJTLU 학부 전공 전체 목록</h2>
            </div>
            <strong class="programme-count">51개 전공</strong>
          </div>
          <p class="lead">현재 XJTLU 학부 과정에 안내된 전공을 전체 목록으로 정리했습니다. 전공명은 학교에서 사용하는 영문 명칭을 그대로 표기하고, 함께 안내된 학위 유형을 표시했습니다.</p>
          <ol class="programme-list">
          {items}
          </ol>
          </section>'''

          pattern = re.compile(
              r'<section class="section"><h2>전공 선택부터 진로를 같이 봐야 합니다</h2>.*?</section>\s*'
              r'<section class="section"><h2>분야별 전공과 진로 방향</h2>.*?</section>',
              re.S,
          )
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'programme overview replacement count={n}')

          css = '''/* TNS FULL PROGRAMME LIST START */
          .programme-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:8px}
          .programme-heading h2{margin-bottom:0}
          .programme-count{flex:0 0 auto;background:var(--navy);color:#fff;padding:8px 12px;border-radius:4px;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.04em}
          .programme-list{list-style:none;margin:24px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--rule);border-left:1px solid var(--rule);counter-reset:programme;background:#fff}
          .programme-list li{counter-increment:programme;display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:10px;min-height:58px;padding:11px 14px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);background:#fff}
          .programme-list li::before{content:counter(programme,decimal-leading-zero);font-family:'DM Mono',monospace;font-size:10px;font-weight:700;color:#9a7827;letter-spacing:.05em}
          .programme-name{font-size:13.5px;line-height:1.45;font-weight:700;color:var(--navy);word-break:normal}
          .programme-degree{font-family:'DM Mono',monospace;font-size:10px;white-space:nowrap;color:#667085;background:#f5f6f8;padding:4px 6px;border-radius:3px}
          @media(max-width:760px){.programme-heading{align-items:flex-start}.programme-count{font-size:10px;padding:7px 9px}.programme-list{grid-template-columns:1fr;margin-top:18px}.programme-list li{grid-template-columns:32px minmax(0,1fr) auto;min-height:52px;padding:10px 11px;gap:8px}.programme-name{font-size:12.5px}.programme-degree{font-size:9px}}
          /* TNS FULL PROGRAMME LIST END */'''
          if '/* TNS FULL PROGRAMME LIST START */' not in s:
              s = s.replace('</style>', css + '\n</style>', 1)

          s = s.replace(
              'content="XJTLU 학부 전공을 경영·AI·공학·과학·약학·디자인·미디어 분야별로 살펴보고, 2025 졸업생 대학원 진학 통계와 취업 분야, 커리어 지원을 정리했습니다."',
              'content="XJTLU 학부 51개 전공 전체 목록과 학위 유형, 2025 졸업생 대학원 진학 결과와 취업·커리어 정보를 정리했습니다."'
          )
          s = s.replace(
              '<div class="wrap quick"><div><b>다양한 전공</b><span>경영·AI·공학·과학·예술</span></div>',
              '<div class="wrap quick"><div><b>51개 학부 전공</b><span>BA·BSc·BEng (Hons)</span></div>'
          )
          s = s.replace('"dateModified":"2026-08-29"', '"dateModified":"2026-09-06"')

          assert '전공 선택부터 진로를 같이 봐야 합니다' not in s
          assert '분야별 전공과 진로 방향' not in s
          assert s.count('class="programme-name"') == 51
          assert 'Accounting' in s and 'Urban Planning and Design' in s
          assert 'Arts, Technology and Entertainment with Contemporary Entrepreneurialism' in s
          assert 'Microelectronic Science and Engineering with Contemporary Entrepreneurialism' in s

          p.write_text(s, encoding='utf-8')
          print('Replaced overview with all 51 undergraduate programmes')
          PY
      - name: Commit update and remove helper workflow
        run: |
          git config user.name "tnsuhak"
          git config user.email "tnsuhak@gmail.com"
          rm -f .github/workflows/apply-full-programme-list.yml
          git add -A
          git commit -m "List all 51 XJTLU undergraduate programmes" || exit 0
          git push origin HEAD:feature/xjtlu-campus-life-guides-20260902
