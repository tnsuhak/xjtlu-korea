name: XJTLU predeploy audit 2026-09-08

on:
  push:
    branches:
      - feature/xjtlu-campus-life-guides-20260902
    paths:
      - '.github/workflows/predeploy-audit-xjtlu-20260908.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/xjtlu-campus-life-guides-20260902
          fetch-depth: 0

      - name: Run predeploy audit
        run: python scripts/predeploy_audit_20260908.py

      - name: Remove temporary audit files
        if: always()
        run: |
          rm -f scripts/predeploy_audit_20260908.py
          rm -f .github/workflows/predeploy-audit-xjtlu-20260908.yml
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Remove temporary XJTLU predeploy audit files'
            git push
          fi
