name: Two-column XJTLU main reviews
on:
  push:
    branches:
      - feature/xjtlu-campus-life-guides-20260902
    paths:
      - .github/workflows/two-column-main-reviews.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/xjtlu-campus-life-guides-20260902
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Make main reviews two-column and normalize related link
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = r'''/* TNS STUDENT REVIEW FEATURE START */
.review-feature-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:24px}
.review-feature{min-width:0}
.review-feature-video{position:relative;padding-top:56.25%;background:#000;overflow:hidden;box-shadow:0 8px 22px rgba(20,33,61,.10)}
.review-feature-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.review-feature-caption{padding:14px 16px;background:#fff;border:1px solid #e4e7ec;border-top:0;min-height:74px}
.review-feature-caption strong{display:block;color:var(--navy);font-size:14px;margin-bottom:3px}
.review-feature-caption span{display:block;color:#667085;font-size:12px;line-height:1.5}
@media(max-width:760px){
  .review-feature-grid{grid-template-columns:1fr;gap:18px;margin-top:20px}
  .review-feature-caption{padding:13px 14px;min-height:0}
}
/* TNS STUDENT REVIEW FEATURE END */'''

          s, n_css = re.subn(
              r'/\* TNS STUDENT REVIEW FEATURE START \*/.*?/\* TNS STUDENT REVIEW FEATURE END \*/',
              css,
              s,
              count=1,
              flags=re.S,
          )
          if n_css != 1:
              raise SystemExit(f'CSS replacement count: {n_css}')

          reviews = r'''<!-- ====== 재학생후기 ====== -->
<div id="reviews">
  <div class="sec fi">
    <p class="label">STUDENT REVIEWS</p>
    <h2 class="sec-h">재학생후기</h2>
    <p class="sec-p">메인에서는 대표 학생 인터뷰 2개를 먼저 보여드립니다. 더 많은 XJTLU 재학생·졸업생 인터뷰와 전공·진로 이야기는 후기 영상 모음에서 확인하세요.</p>
    <div class="review-feature-grid">
      <article class="review-feature">
        <div class="review-feature-video">
          <iframe src="https://www.youtube-nocookie.com/embed/c2h3t771rVk?rel=0" title="XJTLU 한인 학생회장 인터뷰" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
        <div class="review-feature-caption"><strong>XJTLU 한인 학생회장 인터뷰</strong><span>한국 재학생이 직접 전하는 XJTLU 대학생활을 영상으로 확인해 보세요.</span></div>
      </article>
      <article class="review-feature">
        <div class="review-feature-video">
          <iframe src="https://www.youtube-nocookie.com/embed/6eHbOLJ4ERg?rel=0" title="XJTLU 학생 인터뷰" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
        <div class="review-feature-caption"><strong>XJTLU 학생 인터뷰</strong><span>XJTLU 학생이 직접 전하는 학교생활과 경험을 영상으로 확인해 보세요.</span></div>
      </article>
    </div>
    <div class="related-links" aria-label="학생 후기 관련 상세 페이지"><span class="related-label">관련 글</span><a class="related-link" href="xjtlu-student-videos.html">XJTLU 학생 후기 영상 모음<span class="arr">→</span></a></div>
  </div>
</div>

<!-- ====== 입학문의 ====== -->'''

          s, n_html = re.subn(
              r'<!-- ====== 재학생후기 ====== -->.*?<!-- ====== 입학문의 ====== -->',
              reviews,
              s,
              count=1,
              flags=re.S,
          )
          if n_html != 1:
              raise SystemExit(f'HTML replacement count: {n_html}')

          checks = [
              'youtube-nocookie.com/embed/6eHbOLJ4ERg?rel=0',
              'review-feature-grid',
              'XJTLU 학생 후기 영상 모음<span class="arr">→</span>',
          ]
          for item in checks:
              if item not in s:
                  raise SystemExit(f'Missing expected content: {item}')
          if 'review-library-link' in s:
              raise SystemExit('Old oversized review library link remains')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update and remove helper workflow
        run: |
          rm -f .github/workflows/two-column-main-reviews.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/two-column-main-reviews.yml
          git commit -m "Balance homepage student review videos"
          git push origin HEAD:feature/xjtlu-campus-life-guides-20260902
