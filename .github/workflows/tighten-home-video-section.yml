name: Tighten XJTLU homepage video spacing

on:
  push:
    branches:
      - feature/xjtlu-campus-life-guides-20260902
    paths:
      - '.github/workflows/tighten-home-video-section.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/xjtlu-campus-life-guides-20260902
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Tighten homepage campus video section
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_section = '<div style="background:var(--navy);padding:72px 40px;" class="fi">'
          new_section = '<div style="background:var(--navy);padding:40px 40px 32px;" class="fi">'
          if old_section not in s:
              raise SystemExit('homepage video section padding marker not found')
          s = s.replace(old_section, new_section, 1)

          old_wrap = '.video-wrap {\n  margin-top:40px; position:relative; width:100%;'
          new_wrap = '.video-wrap {\n  margin-top:24px; position:relative; width:100%;'
          if old_wrap not in s:
              raise SystemExit('video-wrap margin marker not found')
          s = s.replace(old_wrap, new_wrap, 1)

          old_link = '    <div class="yt-link"><a href="https://youtu.be/B1Itiv_phbo" target="_blank" rel="noopener">▶ 유튜브에서 보기</a></div>\n'
          if old_link not in s:
              raise SystemExit('YouTube external link marker not found')
          s = s.replace(old_link, '', 1)

          assert '▶ 유튜브에서 보기' not in s
          assert 'padding:40px 40px 32px;' in s
          assert 'margin-top:24px; position:relative; width:100%;' in s

          p.write_text(s, encoding='utf-8')
          print('Homepage campus video link removed and vertical spacing tightened')
          PY
      - name: Commit update and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/tighten-home-video-section.yml
          git add -A
          git commit -m "Tighten homepage campus video spacing" || exit 0
          git push origin HEAD:feature/xjtlu-campus-life-guides-20260902
