name: Apply living cost and exchange guide update

on:
  push:
    branches:
      - feature/xjtlu-campus-life-guides-20260902

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/xjtlu-campus-life-guides-20260902
          fetch-depth: 0

      - name: Patch homepage and tuition guide
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          tuition = Path('xjtlu-tuition-scholarships-2027.html')

          s = index.read_text(encoding='utf-8')

          # Remove the detailed living-cost table from the homepage and keep only a compact link.
          pattern = re.compile(
              r'  <!-- 오른쪽: 04 -->\n  <div style="padding:40px 36px;">.*?'
              r'<p style="font-size:11px;color:var\(--mid\);margin-top:8px;font-family:\'DM Mono\',monospace;">'
              r'\* 비자·보험·생활 관련 부대비용 별도 · 실제 금액은 학교 및 중국 정부 기준 확인</p>\n  </div>',
              re.S,
          )
          replacement = '''  <!-- 오른쪽: 04 -->
          <div style="padding:40px 36px;">
            <div class="adm-num">04</div>
            <h3 class="adm-h">생활비</h3>
            <p class="adm-p">쑤저우 생활비 정보는 별도 가이드에서 확인하세요.</p>
            <div class="related-links" aria-label="생활비 상세 가이드"><span class="related-label">관련 글</span><a class="related-link" href="xjtlu-living-cost-2027.html">XJTLU 생활비 2027<span class="arr">→</span></a></div>
          </div>'''
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'homepage living-cost replacement failed: {n}')

          mobile_tuition = '<a class="mob-detail" href="xjtlu-tuition-scholarships-2027.html">2027 학비·장학금</a>'
          if '<a class="mob-detail" href="xjtlu-living-cost-2027.html">' not in s:
              s = s.replace(mobile_tuition, mobile_tuition + '\n  <a class="mob-detail" href="xjtlu-living-cost-2027.html">XJTLU 생활비 2027</a>', 1)

          mobile_dual = '<a class="mob-detail" href="xjtlu-dual-degree-liverpool-2plus2.html">리버풀대학교 복수학위·2+2</a>'
          if '<a class="mob-detail" href="xjtlu-exchange.html">' not in s:
              s = s.replace(mobile_dual, mobile_dual + '\n  <a class="mob-detail" href="xjtlu-exchange.html">XJTLU 교환학생</a>', 1)

          school_group = '<section class="site-menu-group"><h3><a href="#information">학교소개 <small>메인에서 보기 →</small></a></h3><a href="xjtlu-dual-degree-liverpool-2plus2.html">리버풀대학교 복수학위·2+2</a><a href="university-of-liverpool-vietnam.html">리버풀대학교 베트남·아시아 네트워크</a></section>'
          school_group_new = '<section class="site-menu-group"><h3><a href="#information">학교소개 <small>메인에서 보기 →</small></a></h3><a href="xjtlu-dual-degree-liverpool-2plus2.html">리버풀대학교 복수학위·2+2</a><a href="xjtlu-exchange.html">XJTLU 교환학생</a><a href="university-of-liverpool-vietnam.html">리버풀대학교 베트남·아시아 네트워크</a></section>'
          if '<a href="xjtlu-exchange.html">XJTLU 교환학생</a>' not in s:
              if school_group not in s:
                  raise SystemExit('school menu group not found')
              s = s.replace(school_group, school_group_new, 1)

          cost_group = '<section class="site-menu-group"><h3><a href="#calendar">학비·장학금 <small>메인에서 보기 →</small></a></h3><a href="xjtlu-tuition-scholarships-2027.html">2027 학비·장학금 상세</a></section>'
          cost_group_new = '<section class="site-menu-group"><h3><a href="#calendar">학비·장학금 <small>메인에서 보기 →</small></a></h3><a href="xjtlu-tuition-scholarships-2027.html">2027 학비·장학금 상세</a><a href="xjtlu-living-cost-2027.html">XJTLU 생활비 2027</a></section>'
          if '<a href="xjtlu-living-cost-2027.html">XJTLU 생활비 2027</a>' not in s:
              if cost_group not in s:
                  raise SystemExit('cost menu group not found')
              s = s.replace(cost_group, cost_group_new, 1)

          related_old = '<div class="related-links" aria-label="이 내용과 관련된 상세 가이드"><span class="related-label">관련 글</span><a class="related-link" href="xjtlu-tuition-scholarships-2027.html">2027 학비·장학금·연간 비용 자세히<span class="arr">→</span></a></div>'
          related_new = '<div class="related-links" aria-label="이 내용과 관련된 상세 가이드"><span class="related-label">관련 글</span><a class="related-link" href="xjtlu-tuition-scholarships-2027.html">2027 학비·장학금 자세히<span class="arr">→</span></a><a class="related-link" href="xjtlu-living-cost-2027.html">XJTLU 생활비 2027<span class="arr">→</span></a></div>'
          if related_old in s:
              s = s.replace(related_old, related_new, 1)

          footer_tuition = '<li><a href="xjtlu-tuition-scholarships-2027.html">2027 학비·장학금</a></li>'
          if '<li><a href="xjtlu-living-cost-2027.html">XJTLU 생활비 2027</a></li>' not in s:
              s = s.replace(footer_tuition, footer_tuition + '\n        <li><a href="xjtlu-living-cost-2027.html">XJTLU 생활비 2027</a></li>', 1)

          footer_clubs = '<li><a href="xjtlu-clubs-student-organisations.html">동아리·학생단체</a></li>'
          if '<li><a href="xjtlu-exchange.html">XJTLU 교환학생</a></li>' not in s:
              s = s.replace(footer_clubs, footer_clubs + '\n      <li><a href="xjtlu-exchange.html">XJTLU 교환학생</a></li>', 1)

          if '생활비 비교 (RMB/월)' in s or '월 합계' in s:
              raise SystemExit('homepage detailed living-cost table still present')
          for required in ('xjtlu-living-cost-2027.html', 'xjtlu-exchange.html'):
              if required not in s:
                  raise SystemExit(f'homepage missing internal link: {required}')
          index.write_text(s, encoding='utf-8')

          # Update SIP accommodation costs in the tuition guide from daily conversion to 2027 monthly figures.
          t = tuition.read_text(encoding='utf-8')
          t = t.replace('"dateModified":"2026-08-29"', '"dateModified":"2026-09-06"', 1)
          t = t.replace(
              'SIP 캠퍼스의 대표적인 옵션은 하루 50~102위안 수준이며, 타이창 캠퍼스는 연간 6,000위안의 2인실과 연간 14,000위안의 1인실이 안내돼 있습니다.',
              'SIP 캠퍼스의 대표적인 숙소는 장기 계약 기준 월 약 1,500~3,060위안 수준이며, 타이창 캠퍼스는 연간 6,000위안의 2인실과 연간 14,000위안의 1인실이 안내돼 있습니다.',
              1,
          )
          new_sip = '''<section class="section"><h2>SIP 캠퍼스 숙소비</h2><p class="lead">2027 안내에서는 SIP 국제학생 숙소를 월 계약 기준으로 비교할 수 있습니다. 객실 유형과 계약기간에 따라 금액이 달라질 수 있으므로 실제 예약 전 최신 공실과 계약조건을 다시 확인하세요.</p><div class="table-wrap"><table><thead><tr><th>숙소</th><th>월 비용</th><th>학교까지</th><th>주방</th><th>욕실</th></tr></thead><tbody><tr><td>Parfait International Apartments</td><td>약 1,710 RMB</td><td>약 1km</td><td>공용 주방</td><td>개인 욕실</td></tr><tr><td>Parfait Hotel &amp; Apartments</td><td>2,400~2,700 RMB</td><td>약 1km</td><td>전자레인지·냉장고</td><td>개인 욕실</td></tr><tr><td>Wenhua Apartments</td><td>1인실 1,860 RMB<br>2인 공유 시 1인 부담액 절반</td><td>약 7km</td><td>전자레인지·냉장고 설치 가능</td><td>개인 욕실</td></tr><tr><td>MBA Apartments</td><td>장기 거주 약 1,500~1,620 RMB<br>30~90일 2,220~2,340 RMB</td><td>500m 미만</td><td>취사시설 없음</td><td>공용 욕실</td></tr><tr><td>Scholar's Apartments</td><td>Studio 약 2,550~2,700 RMB<br>1 Bedroom 약 3,060 RMB</td><td>약 1km</td><td>전기제품 구입·사용 가능</td><td>개인 욕실</td></tr></tbody></table></div><p class="notice">SIP 숙소는 계약기간과 객실 배정에 따라 금액이 달라질 수 있습니다. 상세 비교는 숙소 가이드에서 확인할 수 있습니다.</p><div class="next"><a href="xjtlu-accommodation-sip-taicang.html">SIP·Taicang 숙소 상세<span>객실 유형·거리·주방·욕실 비교</span></a><a href="xjtlu-living-cost-2027.html">XJTLU 생활비 2027<span>숙소·식비·교통을 포함한 월 생활비 예산</span></a></div></section>'''
          t, n = re.subn(r'<section class="section"><h2>SIP 캠퍼스 기숙사비</h2>.*?</section>\s*(?=<section class="section"><h2>타이창 캠퍼스 기숙사비</h2>)', new_sip + '\n', t, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'tuition SIP section replacement failed: {n}')
          for required in ('Parfait International Apartments', '장기 거주 약 1,500~1,620 RMB', 'xjtlu-living-cost-2027.html'):
              if required not in t:
                  raise SystemExit(f'tuition validation failed: {required}')
          tuition.write_text(t, encoding='utf-8')
          PY

      - name: Commit update and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-living-exchange-20260906.yml
          git add index.html xjtlu-tuition-scholarships-2027.html
          git commit -m "Link living cost and exchange guides"
          git push origin HEAD:feature/xjtlu-campus-life-guides-20260902
