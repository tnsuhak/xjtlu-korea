name: Tune XJTLU related link labels

on:
  push:
    branches:
      - feature/xjtlu-campus-life-guides-20260902
    paths:
      - '.github/workflows/tune-related-labels.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/xjtlu-campus-life-guides-20260902
          fetch-depth: 0
      - name: Expand contextual link labels
        run: python .github/tune-related-labels.py
      - name: Validate diff
        run: git diff --check
      - name: Commit homepage labels and remove one-off files
        run: |
          git config user.name "TNS Site Manager"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git rm .github/tune-related-labels.py .github/workflows/tune-related-labels.yml
          git commit -m "Make XJTLU homepage guide links more descriptive"
          git push origin HEAD:feature/xjtlu-campus-life-guides-20260902
