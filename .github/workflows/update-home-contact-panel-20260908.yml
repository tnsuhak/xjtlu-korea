name: Update XJTLU home contact panel

on:
  push:
    branches:
      - feature/xjtlu-campus-life-guides-20260902
    paths:
      - '.github/workflows/update-home-contact-panel-20260908.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/xjtlu-campus-life-guides-20260902
          fetch-depth: 0

      - name: Apply homepage consultation panel
        run: python scripts/update_home_contact_panel_20260908.py

      - name: Validate contact panel
        run: |
          grep -q '입학 상담, 지금 시작하세요' index.html
          grep -q '네이버 유학카페' index.html
          grep -q '중국 글로벌 대학교 오픈채팅' index.html
          grep -q 'TNS유학 홈페이지' index.html
          grep -q 'tel:01051500105' index.html
          if grep -q '<div class="cta fi">' index.html; then exit 1; fi

      - name: Commit update and remove one-shot files
        run: |
          rm .github/workflows/update-home-contact-panel-20260908.yml
          rm scripts/update_home_contact_panel_20260908.py
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Match XJTLU consultation panel to UNNC style'
          git push
