name: Compact tuition source links on preview

on:
  push:
    branches:
      - preview/xjtlu-korea-working

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/xjtlu-korea-working
          fetch-depth: 0
      - name: Compact source section and fix 2+2 link
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('xjtlu-tuition-scholarships-2027.html')
          s = p.read_text()
          old_css = ".sources{background:#eef1f6;padding:30px}.sources h2{font-size:21px}.sources a{color:#284d83}"
          new_css = ".sources{background:transparent;border-top:1px solid var(--rule);padding:14px 0 0;margin-bottom:36px}.sources p{font-size:12px;line-height:1.8;color:#98a2b3;margin:0}.sources strong{font-size:12px;color:#667085}.sources a{color:#667085;text-decoration:underline;text-underline-offset:2px}"
          old_nav = '<a href="#sources">공식 출처</a>'
          new_nav = '<a href="#sources">자료 출처</a>'
          old_section = '<section class="section sources" id="sources"><h2>공식 확인 자료</h2><ul><li><a href="https://www.xjtlu.edu.cn/en/admissions/global/fees-and-scholarships" target="_blank" rel="noopener">XJTLU 학비·장학금</a></li><li><a href="https://www.xjtlu.edu.cn/en/admissions/global/accommodation" target="_blank" rel="noopener">XJTLU 국제학생 숙소</a></li><li><a href="https://www.xjtlu.edu.cn/en/study/international-mobility/transfer-to-the-university-of-liverpool" target="_blank" rel="noopener">리버풀대학교 2+2 안내</a></li></ul><p>2027 학비·장학금·마감일은 2027 국제학생 모집자료 기준입니다. 공개 웹페이지가 다음 입학연도 기준으로 갱신되면 최신 수치를 우선 적용해야 합니다.</p></section>'
          new_section = '<section class="section sources" id="sources"><p><strong>자료 출처</strong> · <a href="https://www.xjtlu.edu.cn/en/admissions/global/fees-and-scholarships" target="_blank" rel="noopener">학비·장학금</a> · <a href="https://www.xjtlu.edu.cn/en/admissions/global/accommodation" target="_blank" rel="noopener">숙소</a> · <a href="https://www.xjtlu.edu.cn/en/study/international-mobility/transfer-to-university-of-liverpool" target="_blank" rel="noopener">2+2</a><br><span>2027 국제학생 모집자료 기준</span></p></section>'
          replacements = [(old_css,new_css),(old_nav,new_nav),(old_section,new_section)]
          changed = False
          for old,new in replacements:
              if old in s:
                  s = s.replace(old,new,1)
                  changed = True
              elif new not in s:
                  raise SystemExit(f'Expected source pattern not found: {old[:80]}')
          if changed:
              p.write_text(s)
          PY
      - name: Commit preview change
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "tnsuhak"
          git config user.email "actions@users.noreply.github.com"
          git add xjtlu-tuition-scholarships-2027.html
          git commit -m "Compact tuition source links and fix 2+2 URL"
          git push origin HEAD:preview/xjtlu-korea-working
