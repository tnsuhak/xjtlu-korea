name: Make XJTLU admission section white

on:
  push:
    paths:
      - '.github/workflows/make-admission-white.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/xjtlu-campus-life-guides-20260902
          fetch-depth: 0

      - name: Make admission section white
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '<div class="sec-alt" id="admission">'
          new = '<div id="admission">'
          if old not in text:
              raise SystemExit('Admission section wrapper not found')
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one admission wrapper, found {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit update and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/make-admission-white.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/make-admission-white.yml
          git commit -m "Separate campus life and admission backgrounds"
          git push origin HEAD:feature/xjtlu-campus-life-guides-20260902
