name: Rename student review top menu
on:
  push:
    branches:
      - feature/xjtlu-campus-life-guides-20260902
    paths:
      - '.github/workflows/rename-student-review-top-menu-20260906.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename top menu label
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<li><a href="xjtlu-student-videos.html">학생 후기 영상</a></li>'
          new='<li><a href="xjtlu-student-videos.html">학생 후기</a></li>'
          if old not in s:
              raise SystemExit('target not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          grep -q '<li><a href="xjtlu-student-videos.html">학생 후기</a></li>' index.html
          if grep -q '<li><a href="xjtlu-student-videos.html">학생 후기 영상</a></li>' index.html; then exit 1; fi
      - name: Commit changes and remove helper workflow
        run: |
          rm .github/workflows/rename-student-review-top-menu-20260906.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/rename-student-review-top-menu-20260906.yml
          git commit -m 'Rename student review top menu label'
          git push
