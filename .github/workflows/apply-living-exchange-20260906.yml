          <header class="hero"><div class="wrap"><div class="crumb"><a href="/">홈</a> › 교환학생</div><div class="eyebrow">INTERNATIONAL MOBILITY</div><h1>XJTLU 교환학생</h1><p>3학년 한 학기 또는 1년 해외교환과 Summer Abroad를 통해 XJTLU 재학 중 다양한 국가의 대학에서 공부할 수 있습니다.</p></div></header><div class="wrap quick"><div><b>3학년</b><span>Semester / Year Abroad</span></div><div><b>1~2학기</b><span>한 학기 또는 1년</span></div><div><b>학점 인정</b><span>Credit-bearing</span></div><div><b>Summer</b><span>단기 해외수학 선택</span></div></div>
          <main class="wrap"><section class="section"><h2>교환학생과 2+2는 다른 제도입니다</h2><div class="grid"><article class="card"><h3>교환학생</h3><p>3학년에 한 학기 또는 1년 동안 파트너 대학에서 공부하고 XJTLU 학업으로 돌아오는 해외수학입니다. 학점이 학위과정에 반영되는 방식으로 안내됩니다.</p></article><article class="card"><h3>리버풀대학교 2+2</h3><p>1·2학년은 XJTLU에서, 3·4학년은 영국 University of Liverpool에서 정규 학부과정을 이어가는 별도 학업 경로입니다.</p></article></div></section>
          <section class="section"><h2>3학년 Semester / Year Abroad 주요 파트너</h2><p class="lead">파트너와 가능한 기간은 전공에 따라 다릅니다. 아래는 2027 안내에 제시된 학부 교환 예시입니다.</p><div class="table-wrap"><table><thead><tr><th>국가</th><th>파트너 대학</th><th>XJTLU 전공</th><th>기간</th></tr></thead><tbody>
          <tr><td>호주</td><td>University of New South Wales</td><td>Applied Mathematics</td><td>1년</td></tr><tr><td>호주</td><td>University of Wollongong</td><td>Computer Science and Technology</td><td>1년</td></tr><tr><td>캐나다</td><td>University of Calgary</td><td>Economics</td><td>1학기</td></tr><tr><td>캐나다</td><td>University of Calgary</td><td>Economics and Finance</td><td>1학기</td></tr><tr><td>캐나다</td><td>University of Calgary</td><td>Marketing</td><td>1학기</td></tr><tr><td>캐나다</td><td>HEC Montréal</td><td>Business Administration</td><td>1년 또는 1학기</td></tr><tr><td>캐나다</td><td>Toronto Metropolitan University</td><td>Information Management and Information Systems</td><td>1년</td></tr><tr><td>캐나다</td><td>Toronto Metropolitan University</td><td>Urban Planning and Design</td><td>2학기</td></tr><tr><td>프랑스</td><td>EM Strasbourg Business School</td><td>Business Administration</td><td>1학기</td></tr><tr><td>독일</td><td>WHU – Otto Beisheim School of Management</td><td>International Business with a Language (Spanish)</td><td>1학기</td></tr><tr><td>이탈리아</td><td>Ca’ Foscari University of Venice</td><td>Information Management and Information Systems</td><td>2학기</td></tr><tr><td>네덜란드</td><td>University of Groningen</td><td>Economics</td><td>1년</td></tr><tr><td>네덜란드</td><td>University of Groningen</td><td>Economics and Finance</td><td>1년</td></tr><tr><td>노르웨이</td><td>BI Norwegian Business School</td><td>Marketing</td><td>1학기</td></tr><tr><td>스페인</td><td>University of Navarra</td><td>International Business with a Language (Spanish)</td><td>1년 또는 1학기</td></tr><tr><td>스위스</td><td>HEC Lausanne</td><td>Economics</td><td>1년</td></tr><tr><td>스위스</td><td>HEC Lausanne</td><td>Economics and Finance</td><td>2학기</td></tr><tr><td>태국</td><td>Chulalongkorn University</td><td>Marketing</td><td>1년</td></tr><tr><td>태국</td><td>Chulalongkorn University</td><td>Business Administration</td><td>1년 또는 1·2학기</td></tr><tr><td>체코</td><td>Prague University of Economics and Business</td><td>Economics</td><td>1학기</td></tr><tr><td>체코</td><td>Prague University of Economics and Business</td><td>Economics and Finance</td><td>1학기</td></tr><tr><td>체코</td><td>Prague University of Economics and Business</td><td>Business Administration</td><td>1학기</td></tr><tr><td>미국</td><td>Michigan State University</td><td>Applied Mathematics</td><td>1년 또는 1학기</td></tr><tr><td>미국</td><td>University of Texas at Dallas</td><td>Information and Computing Science</td><td>1년</td></tr>
          </tbody></table></div><p class="notice" style="margin-top:14px;">교환 파트너와 지원 가능한 전공·학기는 변경될 수 있습니다. 실제 지원 시점에는 최신 International Mobility 안내를 다시 확인해야 합니다.</p></section>
          <section class="section"><h2>Summer Abroad</h2><p class="lead">학기 교환 외에도 여름 단기 해외수학을 선택할 수 있습니다. 학생은 자신의 학업계획에 맞춰 XJTLU 파트너 기관의 여름 프로그램을 찾거나 다른 대학의 프로그램에 개별 지원할 수 있습니다.</p><div class="notice">2027 안내에는 Hong Kong University, Nanyang Technological University, University of Seoul, Mahidol University, University of Oxford, London School of Economics and Political Science, UCL, University of Cambridge 등이 예시로 소개됩니다.</div></section>
          <section class="section"><h2>같이 확인하면 좋은 페이지</h2><div class="next"><a href="xjtlu-dual-degree-liverpool-2plus2.html">복수학위·리버풀대학교 2+2<span>교환학생과 다른 영국 학위 이동 경로</span></a><a href="xjtlu-programmes-careers-graduate-destinations.html">전공·졸업 후 진로<span>내 전공과 교환 가능성을 함께 확인</span></a></div></section>
          <section class="section faq"><h2>자주 묻는 질문</h2><details><summary>모든 전공이 모든 대학으로 교환 가능한가요?</summary><p>아닙니다. 파트너 대학마다 연결된 XJTLU 전공과 가능한 학기가 다릅니다.</p></details><details><summary>교환학생을 하면 졸업이 늦어지나요?</summary><p>Semester or Year Abroad는 학위에 학점이 반영되는 옵션으로 안내되며, 별도의 학위기간 추가 없이 운영되는 방식입니다. 실제 과목 매칭은 지원 전에 확인해야 합니다.</p></details><details><summary>2+2와 교환학생 중 무엇이 더 좋은가요?</summary><p>목표가 다릅니다. 영국에서 학부 후반 2년을 보내려면 2+2를, 한 학기나 1년 동안 다른 국가의 대학을 경험하려면 교환학생을 비교하는 것이 좋습니다.</p></details></section>
          <section class="sources"><p><strong>자료 출처</strong> · XJTLU Mini Guide to Undergraduate and Master’s 2027 (Version July 2026), International Mobility. 최신 파트너와 지원조건은 <a href="https://www.xjtlu.edu.cn/en/study/international-mobility" target="_blank" rel="noopener">XJTLU International Mobility ↗</a>에서 확인할 수 있습니다.</p></section>
          <section class="cta" id="contact"><h2>내 전공의 교환학생 선택지 확인하기</h2><p>희망 전공과 입학연도를 알려주시면 2+2와 교환학생 경로를 함께 비교해 드립니다.</p><a class="btn" href="https://open.kakao.com/o/slehLvKi" target="_blank" rel="noopener">카카오톡 무료 상담</a><a class="btn alt" href="tel:02-3288-1733">전화 02-3288-1733</a></section></main><footer>© 2026 TNS Worldwide Co., Ltd. · 교환 파트너와 전공별 지원 가능 여부는 해당 연도 안내에 따라 달라질 수 있습니다.</footer></body></html>'''
          Path('xjtlu-exchange.html').write_text(textwrap(exchange), encoding='utf-8')

          # ---------- Sitemap ----------
          sm = sitemap.read_text(encoding='utf-8')
          entries = [
              ('https://xjtlu-korea.netlify.app/xjtlu-living-cost-2027.html', '2026-09-06'),
              ('https://xjtlu-korea.netlify.app/xjtlu-exchange.html', '2026-09-06'),
          ]
          for loc, lastmod in entries:
              if loc not in sm:
                  block = f'  <url>\n    <loc>{loc}</loc>\n    <lastmod>{lastmod}</lastmod>\n  </url>\n'
                  sm = sm.replace('</urlset>', block + '</urlset>')
          sm = sm.replace('<loc>https://xjtlu-korea.netlify.app/xjtlu-tuition-scholarships-2027.html</loc>\n    <lastmod>2026-08-29</lastmod>', '<loc>https://xjtlu-korea.netlify.app/xjtlu-tuition-scholarships-2027.html</loc>\n    <lastmod>2026-09-06</lastmod>')
          sitemap.write_text(sm, encoding='utf-8')

          def textwrap(text):
              # Strip workflow indentation without touching intentional inner HTML formatting.
              lines = text.splitlines()
              if lines and not lines[0].strip(): lines = lines[1:]
              return '\n'.join(line[10:] if line.startswith('          ') else line for line in lines).strip() + '\n'

          # The helper above is defined late for readability; rewrite pages now with normalized indentation.
          Path('xjtlu-living-cost-2027.html').write_text(textwrap(living), encoding='utf-8')
          Path('xjtlu-exchange.html').write_text(textwrap(exchange), encoding='utf-8')

          # Validation
          checks = {
              'index.html': ['xjtlu-living-cost-2027.html', 'xjtlu-exchange.html'],
              'xjtlu-tuition-scholarships-2027.html': ['Parfait International Apartments', '장기 거주 약 1,500~1,620 RMB'],
              'xjtlu-living-cost-2027.html': ['<h1>XJTLU 생활비 2027</h1>', '3,700 RMB', '9,600 RMB'],
              'xjtlu-exchange.html': ['<h1>XJTLU 교환학생</h1>', 'University of New South Wales', 'University of Texas at Dallas'],
              'sitemap.xml': ['xjtlu-living-cost-2027.html', 'xjtlu-exchange.html'],
          }
          for file, needles in checks.items():
              body = Path(file).read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in body:
                      raise SystemExit(f'validation failed: {file}: {needle}')
          print('XJTLU living-cost and exchange guides updated successfully')
          PY

