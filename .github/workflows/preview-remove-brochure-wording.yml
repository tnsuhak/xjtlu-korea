name: Finish compact tuition source cleanup

on:
  push:
    branches:
      - seo/xjtlu-dual-degree-2plus2

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/xjtlu-dual-degree-2plus2
      - name: Remove remaining brochure-style wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('xjtlu-tuition-scholarships-2027.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
            '기숙사비와 예상비용을 공식 모집자료 기준으로 정리했습니다.':'기숙사비와 예상비용을 정리했습니다.',
            '2027 국제학생 모집자료 기준 연간 학비는 99,000위안입니다. 원화 환산액은 납부 시점의 환율에 따라 달라집니다.':'2027년 국제학생 연간 학비는 99,000위안입니다. 원화 환산액은 납부 시점의 환율에 따라 달라집니다.',
            '2027 모집자료에는 10% 얼리버드 할인이 안내돼 있으며 2027년 3월 31일까지의 지원 및 오퍼 조건을 확인해야 합니다.':'2027년 얼리버드 할인은 10%이며, 2027년 3월 31일까지의 지원 및 오퍼 조건을 확인해야 합니다.',
            '2027 국제학생 모집자료에는 최대 50% 입학 장학금이 안내돼 있습니다. 심사 결과에 따라 금액이 달라지며 신청 마감은 2027년 4월 30일로 안내돼 있습니다.':'2027년 입학 장학금은 최대 50%이며, 심사 결과에 따라 금액이 달라집니다. 신청 마감은 2027년 4월 30일입니다.',
            '2027 국제학생 모집자료 기준 연간 학비는 <strong>99,000위안</strong>입니다.':'2027년 국제학생 연간 학비는 <strong>99,000위안</strong>입니다.',
            '<span>2027 국제학생 모집자료 기준</span>':''
          }
          for old,new in replacements.items():
              s=s.replace(old,new)
          if '모집자료' in s or '브로셔' in s:
              raise SystemExit('provenance wording remains')
          if 'transfer-to-the-university-of-liverpool' in s:
              raise SystemExit('stale 2+2 URL remains')
          if 'transfer-to-university-of-liverpool' not in s:
              raise SystemExit('correct 2+2 URL missing')
          if '<h2>공식 확인 자료</h2>' in s:
              raise SystemExit('large source box remains')
          if '<strong>자료 출처</strong>' not in s:
              raise SystemExit('compact source label missing')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "tnsuhak"
          git config user.email "tnsuhak@gmail.com"
          git add xjtlu-tuition-scholarships-2027.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Restore compact tuition source presentation"
          git push origin HEAD:seo/xjtlu-dual-degree-2plus2
