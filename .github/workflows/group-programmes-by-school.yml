name: Group XJTLU programmes by school

on:
  push:
    branches:
      - feature/xjtlu-campus-life-guides-20260902
    paths:
      - '.github/workflows/group-programmes-by-school.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/xjtlu-campus-life-guides-20260902
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Group all 51 programmes by school
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('xjtlu-programmes-careers-graduate-destinations.html')
          s = p.read_text(encoding='utf-8')

          start = s.index('<section class="section programme-section">')
          end_marker = '<section class="section"><h2>2025년 졸업생 진학 결과</h2>'
          end = s.index(end_marker, start)

          groups = [
            ('XJTLU ENTREPRENEUR COLLEGE (TAICANG)', 'XJTLU 창업·혁신대학 (타이창)', 'TAICANG', [
              ('Data Science and Big Data Technology with Contemporary Entrepreneurialism','BEng (Hons)'),
              ('Intelligent Manufacturing Engineering with Contemporary Entrepreneurialism','BEng (Hons)'),
              ('Intelligent Robotics Engineering with Contemporary Entrepreneurialism','BEng (Hons)'),
              ('Intelligent Supply Chain with Contemporary Entrepreneurialism','BSc (Hons)'),
              ('Internet of Things Engineering with Contemporary Entrepreneurialism','BEng (Hons)'),
              ('Microelectronic Science and Engineering with Contemporary Entrepreneurialism','BEng (Hons)'),
            ]),
            ('ACADEMY OF ARTIFICIAL INTELLIGENCE AND ADVANCED TECHNOLOGY', '인공지능·첨단기술 아카데미', '', [
              ('Artificial Intelligence','BEng (Hons)'),
              ('Computer Science and Technology','BEng (Hons)'),
              ('Digital Media Technology','BEng (Hons)'),
              ('Electrical Engineering','BEng (Hons)'),
              ('Electronic Science and Technology','BEng (Hons)'),
              ('Information and Computing Science','BSc (Hons)'),
              ('Mechatronics and Robotic Systems','BEng (Hons)'),
              ('Telecommunications Engineering','BEng (Hons)'),
            ]),
            ('DESIGN SCHOOL', '디자인 스쿨', '', [
              ('Architecture','BEng (Hons)'),
              ('Civil Engineering','BEng (Hons)'),
              ('Industrial Design','BEng (Hons)'),
              ('Urban Planning and Design','BA (Hons)'),
            ]),
            ('ACADEMY OF LIFE AND NATURAL SCIENCES', '생명·자연과학 아카데미', '', [
              ('Applied Chemistry','BSc (Hons)'),
              ('Bioinformatics','BSc (Hons)'),
              ('Biological Sciences','BSc (Hons)'),
              ('Biomedical Sciences','BSc (Hons)'),
              ('Biomedical Statistics','BSc (Hons)'),
              ('Biopharmaceuticals','BSc (Hons)'),
              ('Environmental Science','BSc (Hons)'),
              ('Materials Science and Engineering','BEng (Hons)'),
              ('Pharmaceutical Sciences','BSc (Hons)'),
            ]),
            ('ACADEMY OF FILM AND CREATIVE TECHNOLOGY', '영화·크리에이티브 기술 아카데미', '', [
              ('Arts, Technology and Entertainment with Contemporary Entrepreneurialism','BA (Hons)'),
              ('Digital Media Arts','BA (Hons)'),
              ('Filmmaking','BA (Hons)'),
              ('TV Production','BA (Hons)'),
            ]),
            ('SCHOOL OF HUMANITIES AND SOCIAL SCIENCES', '인문·사회과학 스쿨', '', [
              ('Applied Linguistics','BA (Hons)'),
              ('China Studies','BA (Hons)'),
              ('English and Business','BA (Hons)'),
              ('English and Communication Studies','BA (Hons)'),
              ('English Studies in Global Context','BA (Hons)'),
              ('International Relations','BA (Hons)'),
              ('Media and Communication Studies','BA (Hons)'),
              ('Translation and Interpreting','BA (Hons)'),
            ]),
            ('INTERNATIONAL BUSINESS SCHOOL SUZHOU (IBSS)', '국제비즈니스스쿨 쑤저우 (IBSS)', '', [
              ('Accounting','BA (Hons)'),
              ('Business Administration','BA (Hons)'),
              ('Digital and Intelligent Marketing','BA (Hons)'),
              ('Economics','BSc (Hons)'),
              ('Economics and Finance','BSc (Hons)'),
              ('Human Resource Management and People Analytics','BA (Hons)'),
              ('Information Management and Information Systems','BSc (Hons)'),
              ('International Business with a Language','BA (Hons)'),
            ]),
            ('SCHOOL OF MATHEMATICS AND PHYSICS', '수학·물리학 스쿨', '', [
              ('Actuarial Science','BSc (Hons)'),
              ('Applied Mathematics','BSc (Hons)'),
              ('Applied Physics','BSc (Hons)'),
              ('Financial Mathematics','BSc (Hons)'),
            ]),
          ]

          total = sum(len(items) for _,_,_,items in groups)
          assert total == 51

          cards = []
          for en, ko, campus, items in groups:
              campus_html = f'<span class="school-campus">{campus}</span>' if campus else ''
              lis = ''.join(
                  f'<li><span class="programme-name">{name}</span><span class="programme-degree">{degree}</span></li>'
                  for name, degree in items
              )
              cards.append(
                  '<article class="school-group">'
                  '<div class="school-head">'
                  f'<span class="school-en">{en}</span>'
                  f'<h3>{ko}</h3>'
                  f'<div class="school-meta">{campus_html}<span>{len(items)}개 전공</span></div>'
                  '</div>'
                  f'<ul class="school-programmes">{lis}</ul>'
                  '</article>'
              )

          new_section = '''<section class="section programme-section">
          <div class="programme-heading">
            <div>
              <span class="tag">UNDERGRADUATE PROGRAMMES</span>
              <h2>단과대학별 XJTLU 학부 전공</h2>
            </div>
            <strong class="programme-count">51개 전공</strong>
          </div>
          <p class="lead">전공을 알파벳순으로 나열하기보다 실제 소속 단과대학·아카데미 기준으로 묶었습니다. 전공명과 학위 유형은 현재 학부 전공 목록을 기준으로 표시합니다.</p>
          <div class="school-groups">''' + ''.join(cards) + '''</div>
          </section>

          '''

          s = s[:start] + new_section + s[end:]

          css_start = s.index('/* TNS FULL PROGRAMME LIST START */')
          css_end = s.index('/* TNS FULL PROGRAMME LIST END */', css_start) + len('/* TNS FULL PROGRAMME LIST END */')
          new_css = '''/* TNS SCHOOL-GROUPED PROGRAMME LIST START */
          .programme-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:8px}
          .programme-heading h2{margin-bottom:0}
          .programme-count{flex:0 0 auto;background:var(--navy);color:#fff;padding:8px 12px;border-radius:4px;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.04em}
          .school-groups{display:grid;gap:18px;margin-top:24px}
          .school-group{display:grid;grid-template-columns:260px minmax(0,1fr);background:#fff;border:1px solid var(--rule);border-top:3px solid var(--navy)}
          .school-head{padding:22px 20px;background:#f8f9fb;border-right:1px solid var(--rule)}
          .school-en{display:block;font-family:'DM Mono',monospace;font-size:9.5px;line-height:1.45;letter-spacing:.06em;color:#8a6b20;font-weight:700;margin-bottom:7px}
          .school-head h3{margin:0;color:var(--navy);font-size:17px;line-height:1.4}
          .school-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;font-size:10.5px;color:#7b8492}
          .school-campus{display:inline-block;background:#f7efd8;color:#8a6b20;padding:3px 6px;border-radius:3px;font-family:'DM Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.06em}
          .school-programmes{list-style:none;margin:0;padding:10px 18px;display:grid;grid-template-columns:1fr 1fr;column-gap:18px;align-content:start}
          .school-programmes li{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;padding:9px 2px;border-bottom:1px solid #edf0f3}
          .school-programmes li::before{content:'■';flex:0 0 auto;color:#13a7df;font-size:7px;margin-right:2px}
          .programme-name{flex:1;min-width:0;font-size:12.5px;line-height:1.45;font-weight:700;color:var(--navy);word-break:normal}
          .programme-degree{flex:0 0 auto;font-family:'DM Mono',monospace;font-size:9px;white-space:nowrap;color:#667085;background:#f5f6f8;padding:4px 6px;border-radius:3px}
          @media(max-width:900px){.school-group{grid-template-columns:220px minmax(0,1fr)}.school-programmes{grid-template-columns:1fr}}
          @media(max-width:760px){.programme-heading{align-items:flex-start}.programme-count{font-size:10px;padding:7px 9px}.school-groups{gap:14px;margin-top:18px}.school-group{grid-template-columns:1fr}.school-head{padding:16px 15px;border-right:0;border-bottom:1px solid var(--rule)}.school-en{font-size:9px}.school-head h3{font-size:16px}.school-meta{margin-top:8px}.school-programmes{grid-template-columns:1fr;padding:5px 14px 8px}.school-programmes li{min-height:44px;padding:8px 1px}.programme-name{font-size:12px}.programme-degree{font-size:8.5px}}
          /* TNS SCHOOL-GROUPED PROGRAMME LIST END */'''
          s = s[:css_start] + new_css + s[css_end:]

          s = s.replace('XJTLU 학부 51개 전공 전체 목록과 학위 유형, 2025 졸업생 대학원 진학 결과와 취업·커리어 정보를 정리했습니다.', 'XJTLU 학부 51개 전공을 단과대학·아카데미별로 정리하고, 학위 유형과 2025 졸업생 대학원 진학 결과, 취업·커리어 정보를 안내합니다.')

          assert s.count('class="school-group"') == 8
          assert s.count('class="programme-name"') == 51
          assert 'XJTLU 학부 전공 전체 목록' not in s
          assert '단과대학별 XJTLU 학부 전공' in s
          p.write_text(s, encoding='utf-8')
          print('Grouped 51 programmes into 8 schools/academies')
          PY
      - name: Commit update and remove helper workflow
        run: |
          git config user.name "tnsuhak"
          git config user.email "tnsuhak@gmail.com"
          rm -f .github/workflows/group-programmes-by-school.yml
          git add -A
          git commit -m "Group XJTLU programmes by school" || exit 0
          git push origin HEAD:feature/xjtlu-campus-life-guides-20260902
