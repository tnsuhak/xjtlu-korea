name: Move Taicang programmes to bottom

on:
  push:
    branches:
      - feature/xjtlu-campus-life-guides-20260902
    paths:
      - '.github/workflows/move-taicang-programmes-last-20260909.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/xjtlu-campus-life-guides-20260902
          fetch-depth: 0

      - name: Move Taicang group after Mathematics and Physics
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('xjtlu-programmes-careers-graduate-destinations.html')
          s = p.read_text(encoding='utf-8')
          marker = '<div class="school-groups">'
          start = s.index(marker) + len(marker)
          first_end = s.index('</article>', start) + len('</article>')
          first = s[start:first_end]
          assert 'XJTLU ENTREPRENEUR COLLEGE (TAICANG)' in first
          group_end = s.index('</div>\n</section>', first_end)
          rest = s[first_end:group_end]
          assert 'SCHOOL OF MATHEMATICS AND PHYSICS' in rest
          s = s[:start] + rest + first + s[group_end:]
          s = s.replace('"dateModified":"2026-09-06"', '"dateModified":"2026-09-09"', 1)
          p.write_text(s, encoding='utf-8')

          sm = Path('sitemap.xml')
          x = sm.read_text(encoding='utf-8')
          target = '''    <loc>https://xjtlu-korea.netlify.app/xjtlu-programmes-careers-graduate-destinations.html</loc>\n    <lastmod>2026-09-06</lastmod>'''
          repl = '''    <loc>https://xjtlu-korea.netlify.app/xjtlu-programmes-careers-graduate-destinations.html</loc>\n    <lastmod>2026-09-09</lastmod>'''
          assert target in x
          sm.write_text(x.replace(target, repl, 1), encoding='utf-8')
          PY

      - name: Validate order
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('xjtlu-programmes-careers-graduate-destinations.html').read_text(encoding='utf-8')
          section = s[s.index('<div class="school-groups">'):s.index('</div>\n</section>', s.index('<div class="school-groups">'))]
          assert section.count('<article class="school-group">') == 8
          ai = section.index('ACADEMY OF ARTIFICIAL INTELLIGENCE AND ADVANCED TECHNOLOGY')
          math = section.index('SCHOOL OF MATHEMATICS AND PHYSICS')
          taicang = section.index('XJTLU ENTREPRENEUR COLLEGE (TAICANG)')
          assert ai < math < taicang
          assert '"dateModified":"2026-09-09"' in s
          assert '<lastmod>2026-09-09</lastmod>' in Path('sitemap.xml').read_text(encoding='utf-8')
          PY

      - name: Commit and remove helper
        run: |
          rm .github/workflows/move-taicang-programmes-last-20260909.yml
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Move Taicang programmes to end of XJTLU list'
          git push
