name: Reword dual degree and 2+2 intro on preview

on:
  push:
    branches:
      - seo/xjtlu-dual-degree-2plus2

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/xjtlu-dual-degree-2plus2
      - name: Reword intro paragraph
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('xjtlu-dual-degree-liverpool-2plus2.html')
          s = p.read_text(encoding='utf-8')
          old = '<p class="lead"><strong>복수학위는 ‘졸업할 때 받는 학위’에 관한 제도이고, 2+2는 ‘어디에서 공부할지’에 관한 선택 경로입니다.</strong> 일반적인 XJTLU 학부과정은 쑤저우에서 4년을 모두 이수해도 졸업요건을 충족하면 XJTLU 학위와 영국 리버풀대학교 학위를 함께 취득합니다. 2+2를 선택하면 1·2학년은 XJTLU, 3·4학년은 영국 리버풀대학교에서 공부합니다.</p>'
          new = '<p class="lead"><strong>복수학위는 졸업 시 영국 리버풀대학교 + 중국 XJTLU의 2개 학위를 받는다는 의미이며, 2+2는 중국에서 2년 + 영국에서 2년을 공부할 수 있다는 의미입니다.</strong> 2학년으로 직접 입학하는 학생의 경우에는 XJTLU에서 2학년 1년을 이수한 뒤, 해당 전공의 2+2 경로와 진급요건을 충족하면 영국 리버풀대학교에서 2년을 공부하는 방식도 가능합니다.</p>'
          if old not in s:
              raise SystemExit('intro target not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit preview changes
        run: |
          git config user.name "tnsuhak"
          git config user.email "tnsuhak@gmail.com"
          git add xjtlu-dual-degree-liverpool-2plus2.html
          if git diff --cached --quiet; then
            echo "No content changes"
            exit 0
          fi
          git commit -m "Clarify dual degree and year-two 2+2 route"
          git push origin HEAD:seo/xjtlu-dual-degree-2plus2
