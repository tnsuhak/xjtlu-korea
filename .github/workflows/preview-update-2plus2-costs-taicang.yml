name: Update 2+2 costs and Taicang programmes on preview

on:
  push:
    branches:
      - seo/xjtlu-dual-degree-2plus2

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/xjtlu-dual-degree-2plus2
      - name: Update page
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('xjtlu-dual-degree-liverpool-2plus2.html')
          s = p.read_text(encoding='utf-8')

          old_desc = '<meta name="description" content="XJTLU 복수학위와 리버풀대학교 2+2 과정의 차이를 정리했습니다. 중국 4년 재학과 영국 2+2 이동 경로, 취득 학위, 대상 전공, 영국 학비 10% 할인까지 공식 자료 기준으로 안내합니다.">'
          new_desc = '<meta name="description" content="XJTLU 복수학위와 리버풀대학교 2+2 차이, 중국 4년과 영국 2+2의 학비·숙소비 구조, 취득 학위, 타이창 2+1+1 대상 전공을 2027 공식 자료 기준으로 정리했습니다.">'
          s = s.replace(old_desc, new_desc)

          old_table = '''<section class="section"><h2>중국 4년과 영국 2+2 비교</h2><div class="table-wrap"><table><thead><tr><th>구분</th><th>XJTLU 4년 재학</th><th>리버풀대학교 2+2</th></tr></thead><tbody><tr><td>학업 장소</td><td>1~4학년 중국 쑤저우</td><td>1~2학년 쑤저우, 3~4학년 영국 리버풀</td></tr><tr><td>취득 학위</td><td>일반적인 대상 전공은 XJTLU 학위 + 리버풀대학교 학위</td><td>XJTLU 학위 + 리버풀대학교 학위</td></tr><tr><td>학비 구조</td><td>XJTLU 국제학생 학비 기준</td><td>3·4학년 리버풀대학교 국제학생 학비 적용, XJTLU 2+2 학생 10% 할인</td></tr><tr><td>생활 경험</td><td>중국·아시아 비즈니스 환경과 쑤저우 생활</td><td>중국 2년 + 영국 2년의 양국 캠퍼스 경험</td></tr><tr><td>확인할 사항</td><td>해당 전공의 학위 수여 형태</td><td>전공별 연계 과정, 진입조건, 영국 비자·생활비</td></tr></tbody></table></div></section>'''
          new_table = '''<section class="section"><h2>중국 4년과 영국 2+2 비교</h2><div class="table-wrap"><table><thead><tr><th>구분</th><th>XJTLU 4년 재학</th><th>리버풀대학교 2+2</th></tr></thead><tbody><tr><td>학업 장소</td><td>1~4학년 중국 쑤저우</td><td>1~2학년 쑤저우, 3~4학년 영국 리버풀</td></tr><tr><td>취득 학위</td><td>일반적인 대상 전공은 XJTLU 학위 + 리버풀대학교 학위</td><td>XJTLU 학위 + 리버풀대학교 학위</td></tr><tr><td>연간 학비</td><td><strong>2027년 99,000 RMB</strong><br><span style="color:var(--mid);font-size:12px;">장학금·얼리버드 적용 전</span></td><td><strong>3·4학년은 University of Liverpool 전공별 국제학생 학비</strong><br><span style="color:var(--mid);font-size:12px;">XJTLU 2+2 학생은 Liverpool 학비 10% 할인</span></td></tr><tr><td>기숙사·숙소</td><td>SIP 대표 옵션 약 <strong>1,500~3,060 RMB/월</strong><br><span style="color:var(--mid);font-size:12px;">객실 유형에 따라 차이</span></td><td>University of Liverpool 기숙사는 홀·객실·계약기간별 요금이 다름<br><span style="color:var(--mid);font-size:12px;">영국 이동 연도의 공식 기숙사비를 별도 확인</span></td></tr><tr><td>생활 경험</td><td>중국·아시아 비즈니스 환경과 쑤저우 생활</td><td>중국 2년 + 영국 2년의 양국 캠퍼스 경험</td></tr><tr><td>확인할 사항</td><td>해당 전공의 학위 수여 형태</td><td>전공별 연계 과정, 진입조건, 영국 비자·학비·기숙사·생활비</td></tr></tbody></table></div><p class="notice" style="margin-top:18px;"><strong>비용 비교 시 주의:</strong> XJTLU 금액은 2027 국제학생 모집자료와 현재 공식 숙소 안내를 기준으로 표시했습니다. Liverpool의 3·4학년 학비와 기숙사비는 전공·객실·입학연도에 따라 달라지므로 이동하는 연도의 University of Liverpool 공식 금액을 기준으로 예산을 확정해야 합니다.</p></section>'''
          if old_table not in s and '2027년 99,000 RMB' not in s:
              raise SystemExit('comparison table target not found')
          s = s.replace(old_table, new_table)

          old_taicang = '''<section class="section"><h2>타이창 2+1+1은 별도 경로</h2><p class="lead">XJTLU Entrepreneur College(Taicang)의 일부 지정 전공에는 3학년을 리버풀에서 공부하고 4학년을 다시 XJTLU에서 마치는 <strong>2+1+1</strong> 경로도 있습니다. 일반적인 2+2와 학업 순서가 다르며, 현재 공식 안내상 지정된 일부 전공에만 적용됩니다.</p></section>'''
          new_taicang = '''<section class="section"><h2>타이창 2+1+1은 별도 경로</h2><p class="lead">XJTLU Entrepreneur College(Taicang)의 일부 지정 전공에는 3학년을 리버풀에서 공부하고 4학년을 다시 XJTLU에서 마치는 <strong>2+1+1</strong> 경로가 있습니다. 일반적인 2+2와 학업 순서가 다르며, 전공별 제공 여부와 학업조건을 확인해야 합니다.</p><div class="grid"><article class="card"><span class="tag">TAICANG UNDERGRADUATE</span><h3>2027 브로셔에 안내된 주요 학부 전공</h3><ul><li>Data Science and Big Data Technology</li><li>Intelligent Manufacturing Engineering</li><li>Intelligent Robotics Engineering</li><li>Intelligent Supply Chain</li><li>Internet of Things Engineering</li><li>Microelectronic Science and Engineering</li></ul></article><article class="card"><span class="tag">2+1+1 ROUTE</span><h3>타이창 → 리버풀 → 타이창</h3><p><strong>1·2학년 타이창 → 3학년 University of Liverpool → 4학년 XJTLU 타이창</strong> 순서입니다.</p><p>타이창 기숙사 안내 예시는 2인실 <strong>1인당 연 6,000 RMB</strong>, 1인실 <strong>연 14,000 RMB</strong>입니다. 실제 배정과 금액은 해당 연도 숙소 안내를 확인해야 합니다.</p></article></div><p class="notice" style="margin-top:18px;">위 전공 목록은 2027 XJTLU 국제학생 브로셔 기준입니다. 모든 타이창 전공이 2+1+1을 자동으로 제공하는 것은 아니며, 실제 Liverpool 이동 가능 전공과 조건은 지원 연도에 다시 확인합니다.</p></section>'''
          if old_taicang not in s and '2027 브로셔에 안내된 주요 학부 전공' not in s:
              raise SystemExit('Taicang target not found')
          s = s.replace(old_taicang, new_taicang)

          old_sources = '<a href="https://www.xjtlu.edu.cn/en/admissions/global/fees-and-scholarships" target="_blank" rel="noopener" style="color:#516b8f;">2+2 학비 할인 ↗</a> · <a href="https://www.liverpool.ac.uk/xjtlu/courses/" target="_blank" rel="noopener" style="color:#516b8f;">전공별 연계 과정 ↗</a>'
          new_sources = '<a href="https://www.xjtlu.edu.cn/en/admissions/global/fees-and-scholarships" target="_blank" rel="noopener" style="color:#516b8f;">학비·2+2 할인 ↗</a> · <a href="https://www.xjtlu.edu.cn/en/admissions/global/accommodation" target="_blank" rel="noopener" style="color:#516b8f;">XJTLU 숙소 ↗</a> · <a href="https://www.xjtlu.edu.cn/en/study/undergraduate/" target="_blank" rel="noopener" style="color:#516b8f;">타이창 전공 ↗</a> · <a href="https://www.liverpool.ac.uk/xjtlu/courses/" target="_blank" rel="noopener" style="color:#516b8f;">전공별 연계 과정 ↗</a>'
          s = s.replace(old_sources, new_sources)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit preview changes
        run: |
          git config user.name "tnsuhak"
          git config user.email "tnsuhak@gmail.com"
          git add xjtlu-dual-degree-liverpool-2plus2.html
          if git diff --cached --quiet; then
            echo "No content changes"
            exit 0
          fi
          git commit -m "Add 2+2 cost comparison and Taicang programmes"
          git push origin HEAD:seo/xjtlu-dual-degree-2plus2
