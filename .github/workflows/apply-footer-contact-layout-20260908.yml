name: Apply XJTLU footer contact layout

on:
  push:
    branches:
      - feature/xjtlu-campus-life-guides-20260902
    paths:
      - '.github/workflows/apply-footer-contact-layout-20260908.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/xjtlu-campus-life-guides-20260902
          fetch-depth: 0
      - name: Apply footer patch
        run: python scripts/rework_home_footer_contact_20260908.py
      - name: Commit changes
        run: |
          rm -f .github/workflows/apply-footer-contact-layout-20260908.yml
          rm -f .github/workflows/rework-home-footer-contact-20260908.yml
          rm -f scripts/rework_home_footer_contact_20260908.py
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rework XJTLU footer office contacts'
          git push
