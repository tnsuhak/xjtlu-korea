name: Add two Korean student reviews

on:
  push:
    branches:
      - feature/xjtlu-campus-life-guides-20260902
    paths:
      - '.github/workflows/add-two-korean-reviews.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/xjtlu-campus-life-guides-20260902
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Add Korean student review videos
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('xjtlu-student-videos.html')
          s = p.read_text(encoding='utf-8')
          marker = '<div class="video-group-title"><span>INTERNATIONAL STUDENTS</span>외국인 재학생 후기</div>'
          if 'h0t65P789sw' not in s:
              insert = '''<article class="video-card"><div class="video-frame"><iframe src="https://www.youtube-nocookie.com/embed/h0t65P789sw?rel=0" title="XJTLU 한국 재학생 후기 영상 3" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div><div class="video-copy"><span class="video-num">06 · KOREAN STUDENT</span><h2>한국 재학생 후기 ③</h2><p>한국 재학생이 직접 전하는 XJTLU 학업과 캠퍼스 생활 경험을 영상으로 확인해 보세요.</p></div></article>\n<article class="video-card"><div class="video-frame"><iframe src="https://www.youtube-nocookie.com/embed/vXv_1GtqFdE?rel=0" title="XJTLU 한국 재학생 후기 영상 4" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div><div class="video-copy"><span class="video-num">07 · KOREAN STUDENT</span><h2>한국 재학생 후기 ④</h2><p>한국 학생의 시각에서 본 XJTLU 수업과 대학생활 이야기를 추가로 확인할 수 있습니다.</p></div></article>\n'''
              if marker not in s:
                  raise SystemExit('International student section marker not found')
              s = s.replace(marker, insert + marker, 1)
          s = s.replace('06 · INTERNATIONAL STUDENT', '08 · INTERNATIONAL STUDENT', 1)
          s = s.replace('07 · INTERNATIONAL STUDENT', '09 · INTERNATIONAL STUDENT', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate review videos
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('xjtlu-student-videos.html').read_text(encoding='utf-8')
          assert 'h0t65P789sw' in s
          assert 'vXv_1GtqFdE' in s
          assert '08 · INTERNATIONAL STUDENT' in s
          assert '09 · INTERNATIONAL STUDENT' in s
          print('Validated two Korean student review videos')
          PY
      - name: Commit and clean helper workflow
        run: |
          git config user.name "tnsuhak"
          git config user.email "tnsuhak@gmail.com"
          rm -f .github/workflows/add-two-korean-reviews.yml
          git add -A
          git commit -m "Add two Korean student review videos" || exit 0
          git push origin HEAD:feature/xjtlu-campus-life-guides-20260902
