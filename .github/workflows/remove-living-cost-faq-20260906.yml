name: Remove living cost FAQ

on:
  push:
    branches:
      - feature/xjtlu-campus-life-guides-20260902

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/xjtlu-campus-life-guides-20260902
          fetch-depth: 0

      - name: Remove visible FAQ and FAQ structured data
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('xjtlu-living-cost-2027.html')
          s = p.read_text(encoding='utf-8')

          # Remove FAQPage JSON-LD so structured data continues to match visible content.
          s, n_schema = re.subn(
              r'<script type="application/ld\+json">\{"@context":"https://schema\.org","@type":"FAQPage".*?</script>\n?',
              '',
              s,
              count=1,
              flags=re.S,
          )

          # Remove the visible FAQ section.
          s, n_visible = re.subn(
              r'<section class="section faq"><h2>자주 묻는 질문</h2>.*?</section>\n?',
              '',
              s,
              count=1,
              flags=re.S,
          )

          # Remove now-unused FAQ-only CSS.
          s = s.replace('.faq details{background:#fff;border-bottom:1px solid var(--rule);padding:16px 20px}.faq summary{font-weight:700;color:var(--navy);cursor:pointer}.faq p{font-size:14px;color:#596273}', '')

          if n_schema != 1:
              raise SystemExit(f'FAQ schema removal failed: {n_schema}')
          if n_visible != 1:
              raise SystemExit(f'visible FAQ removal failed: {n_visible}')
          if '자주 묻는 질문' in s or '"@type":"FAQPage"' in s:
              raise SystemExit('FAQ content still remains')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit cleanup and remove helper workflow
        run: |
          rm .github/workflows/remove-living-cost-faq-20260906.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xjtlu-living-cost-2027.html .github/workflows/remove-living-cost-faq-20260906.yml
          git commit -m "Remove FAQ from XJTLU living cost guide"
          git push origin HEAD:feature/xjtlu-campus-life-guides-20260902
