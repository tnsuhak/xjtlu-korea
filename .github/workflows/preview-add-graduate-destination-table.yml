name: Add graduate destination results to preview

on:
  push:
    branches:
      - seo/xjtlu-programmes-careers

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/xjtlu-programmes-careers
      - name: Update graduate destinations page
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path('xjtlu-programmes-careers-graduate-destinations.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<p class="notice" style="margin-top:18px;">공식 웹페이지는 TOP 10·TOP 100 수치의 산정 대상을 별도로 자세히 설명하지 않습니다. 따라서 세 수치를 전체 졸업생 비율로 단순 합산하기보다, 학교가 공개한 대학원 진학 실적으로 이해하는 것이 안전합니다.</p>','')
          s=s.replace('<p class="notice" style="margin-top:18px;"><strong>국제학생 주의:</strong> 중국 내 취업 기회와 실제 근무 가능 여부는 같은 문제가 아닙니다. 외국인은 채용 조건과 함께 취업비자·근무 자격을 별도로 충족해야 합니다.</p>','')
          marker='</div></section>\n\n<section class="section"><h2>취업을 선택하는 경우</h2>'
          table=base64.b64decode('
...TRUNCATED_PLACEHOLDER...')
          table=table.decode('utf-8')
          if 'dest-table-wrap' not in s:
              s=s.replace(marker, table+marker)
          css='.dest-table-wrap{overflow:auto;max-height:720px;background:#fff;border:1px solid var(--rule);margin-top:28px}.dest-table{min-width:860px}.dest-table thead th{position:sticky;top:0;z-index:1}.dest-table td:nth-child(n+3),.dest-table th:nth-child(n+3){text-align:center}.dest-table .up{color:#d12f6a;font-weight:700}.dest-table .down{color:#3478c8;font-weight:700}'
          if '.dest-table-wrap{' not in s:
              s=s.replace('.table-wrap{overflow-x:auto;background:#fff;border:1px solid var(--rule)}', '.table-wrap{overflow-x:auto;background:#fff;border:1px solid var(--rule)}'+css)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit update and remove workflow
        run: |
          git config user.name "tnsuhak"
          git config user.email "tnsuhak@gmail.com"
          git add xjtlu-programmes-careers-graduate-destinations.html
          git rm .github/workflows/preview-add-graduate-destination-table.yml
          git commit -m "Add 2025 graduate destination university results"
          git push origin HEAD:seo/xjtlu-programmes-careers
