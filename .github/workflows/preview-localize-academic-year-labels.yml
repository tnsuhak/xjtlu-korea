name: Localize academic year labels on 2+2 preview

on:
  push:
    branches:
      - seo/xjtlu-dual-degree-2plus2

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/xjtlu-dual-degree-2plus2
      - name: Localize year labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('xjtlu-dual-degree-liverpool-2plus2.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('2026/27', '2026')
          s = s.replace('2027/28', '2027')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit preview changes
        run: |
          git config user.name "tnsuhak"
          git config user.email "tnsuhak@gmail.com"
          git add xjtlu-dual-degree-liverpool-2plus2.html
          if git diff --cached --quiet; then
            echo "No content changes"
            exit 0
          fi
          git commit -m "Use Korean-style year labels in 2+2 cost table"
          git push origin HEAD:seo/xjtlu-dual-degree-2plus2
