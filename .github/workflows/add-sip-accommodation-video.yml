name: Add SIP accommodation video

on:
  push:
    branches:
      - feature/xjtlu-campus-life-guides-20260902
    paths:
      - '.github/workflows/add-sip-accommodation-video.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/xjtlu-campus-life-guides-20260902
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Insert SIP accommodation video
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p = Path('xjtlu-accommodation-sip-taicang.html')
          s = p.read_text(encoding='utf-8')
          marker = 'TNS SIP ACCOMMODATION VIDEO START'
          if marker in s:
              raise SystemExit('Video already present')
          css = base64.b64decode('').decode('utf-8')
          block = base64.b64decode('').decode('utf-8')
          if '</style>' not in s:
              raise SystemExit('No style block')
          s = s.replace('</style>', css + '\n</style>', 1)
          start = s.find('<section class="section"><h2>SIP 캠퍼스 숙소</h2>')
          if start == -1:
              raise SystemExit('SIP section not found')
          end = s.find('</section>', start)
          if end == -1:
              raise SystemExit('SIP section end not found')
          end += len('</section>')
          s = s[:end] + '\n' + block + s[end:]
          p.write_text(s, encoding='utf-8')
          print('Inserted SIP accommodation video')
          PY
      - name: Validate video embed
        run: |
          grep -q 'r_SJ1rLfXfk' xjtlu-accommodation-sip-taicang.html
          grep -q 'TNS SIP ACCOMMODATION VIDEO START' xjtlu-accommodation-sip-taicang.html
      - name: Commit and remove helper workflow
        run: |
          git config user.name "tnsuhak"
          git config user.email "tnsuhak@gmail.com"
          rm -f .github/workflows/add-sip-accommodation-video.yml
          git add -A
          git commit -m "Add SIP accommodation video" || exit 0
          git push origin HEAD:feature/xjtlu-campus-life-guides-20260902
