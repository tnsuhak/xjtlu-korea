name: Simplify graduate results preview

on:
  push:
    branches:
      - seo/xjtlu-programmes-careers

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/xjtlu-programmes-careers
      - name: Simplify 2025 graduate destination presentation
        run: |
          python - <<'PY'
          from pathlib import Path
          from html import unescape, escape
          import re

          p = Path('xjtlu-programmes-careers-graduate-destinations.html')
          s = p.read_text(encoding='utf-8')

          block_re = re.compile(r'<div class="dest-table-wrap"><table class="dest-table">.*?</table></div><p class="lead" style="margin-top:14px;font-size:12px;">.*?</p>', re.S)
          m = block_re.search(s)
          if not m:
              raise SystemExit('graduate table block not found')

          block = m.group(0)
          row_html = re.findall(r'<tr>(.*?)</tr>', block, re.S)
          rows = []
          for row in row_html:
              cells = re.findall(r'<td(?: class="[^"]*")?>(.*?)</td>', row, re.S)
              if len(cells) != 7:
                  continue
              vals = [unescape(re.sub(r'<[^>]+>', '', c)).strip() for c in cells]
              name, country, y23, y24, y25, delta, rank = vals
              if y25 == '—':
                  continue
              rows.append((name, country, y25, rank))

          if len(rows) < 30:
              raise SystemExit(f'unexpectedly few 2025 rows: {len(rows)}')

          def count_num(v):
              try:
                  return int(v.replace(',', ''))
              except Exception:
                  return 0

          top5 = sorted(rows, key=lambda x: count_num(x[2]), reverse=True)[:5]
          featured = ''.join(
              f'<div class="destination-highlight"><strong>{escape(name)}</strong><b>{escape(y25)}명</b><span>{escape(country)} · 2027 QS {escape(rank)}</span></div>'
              for name, country, y25, rank in top5
          )

          def table_html(items):
              trs = ''.join(
                  f'<tr><td>{escape(name)}</td><td>{escape(country)}</td><td><strong>{escape(y25)}명</strong></td><td>{escape(rank)}</td></tr>'
                  for name, country, y25, rank in items
              )
              return '<div class="dest-table-wrap"><table class="dest-table"><thead><tr><th>대학교</th><th>국가</th><th>2025 진학자</th><th>2027 QS</th></tr></thead><tbody>' + trs + '</tbody></table></div>'

          first = rows[:30]
          rest = rows[30:]
          replacement = (
              '<div class="destination-summary">'
              '<h3>2025 주요 대학 진학 결과</h3>'
              '<p>2025년에 실제 진학자가 공개된 대학만 추려서 보여드립니다. 먼저 진학자가 특히 많은 대학을 한눈에 보고, 아래 표에서 QS 순위가 높은 대학부터 확인할 수 있습니다.</p>'
              '<div class="destination-highlights">' + featured + '</div>'
              '</div>'
              + table_html(first)
              + (f'<details class="more-destinations"><summary>나머지 대학 {len(rest)}곳 더 보기</summary>{table_html(rest)}</details>' if rest else '')
              + '<p class="lead destination-note">진학자 수는 실제 해당 대학교에 진학한 학생 수입니다. 합격자 수가 아니라 실제 진학 기준입니다.</p>'
          )
          s = s[:m.start()] + replacement + s[m.end():]

          old_css = '.dest-table-wrap{overflow:auto;max-height:720px;background:#fff;border:1px solid var(--rule);margin-top:28px}.dest-table{min-width:860px}.dest-table thead th{position:sticky;top:0;z-index:1}.dest-table td:nth-child(n+3),.dest-table th:nth-child(n+3){text-align:center}.dest-table .up{color:#d12f6a;font-weight:700}.dest-table .down{color:#3478c8;font-weight:700}'
          new_css = '.destination-summary{margin-top:32px}.destination-summary h3{font-size:20px;color:var(--navy);margin:0 0 8px}.destination-summary>p{font-size:13px;color:var(--mid);margin:0 0 18px}.destination-highlights{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:22px}.destination-highlight{background:#fff;border:1px solid var(--rule);padding:16px}.destination-highlight strong{display:block;color:var(--navy);font-size:13px;line-height:1.45;min-height:38px}.destination-highlight b{display:block;color:var(--navy);font-size:24px;line-height:1.2;margin:10px 0 4px}.destination-highlight span{display:block;color:var(--mid);font-size:11px}.dest-table-wrap{overflow-x:auto;background:#fff;border:1px solid var(--rule);margin-top:16px}.dest-table{min-width:620px}.dest-table th:nth-child(3),.dest-table td:nth-child(3),.dest-table th:nth-child(4),.dest-table td:nth-child(4){text-align:center}.more-destinations{margin-top:14px;background:#fff;border:1px solid var(--rule)}.more-destinations summary{cursor:pointer;padding:16px 18px;font-weight:700;color:var(--navy);font-size:14px}.more-destinations .dest-table-wrap{margin:0;border-left:0;border-right:0;border-bottom:0}.destination-note{margin-top:14px!important;font-size:12px!important}.dest-table thead th{position:sticky;top:0;z-index:1}@media(max-width:760px){.destination-highlights{grid-template-columns:1fr 1fr}.destination-highlight:last-child{grid-column:1/-1}.dest-table{min-width:560px}}'
          if old_css in s:
              s = s.replace(old_css, new_css)
          elif '.destination-highlights{' not in s:
              s = s.replace('.table-wrap{overflow-x:auto;background:#fff;border:1px solid var(--rule)}', '.table-wrap{overflow-x:auto;background:#fff;border:1px solid var(--rule)}' + new_css)

          # Ensure the previous columns and delta labels are gone from the rendered destination tables.
          if '>2023<' in replacement or '>2024<' in replacement or '전년 대비' in replacement:
              raise SystemExit('old columns remain in replacement')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate simplified table
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('xjtlu-programmes-careers-graduate-destinations.html').read_text(encoding='utf-8')
          checks = [
              '2025 주요 대학 진학 결과',
              '2025 진학자',
              '2027 QS',
              'destination-highlights',
              '나머지 대학',
              'UCL',
              '1,018명',
          ]
          missing=[x for x in checks if x not in s]
          if missing: raise SystemExit('missing: '+', '.join(missing))
          if '공식 웹페이지는 TOP 10·TOP 100 수치의 산정 대상을' in s: raise SystemExit('deleted caution returned')
          if '<strong>국제학생 주의:</strong>' in s: raise SystemExit('deleted work-visa caution returned')
          print('PASS: simplified 2025-only graduate results presentation')
          PY
      - name: Commit preview update and remove workflow
        run: |
          git config user.name "tnsuhak"
          git config user.email "tnsuhak@gmail.com"
          git add xjtlu-programmes-careers-graduate-destinations.html
          git rm .github/workflows/preview-simplify-graduate-table.yml
          git commit -m "Simplify 2025 graduate destination results"
          git push origin HEAD:seo/xjtlu-programmes-careers
