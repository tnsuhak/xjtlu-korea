name: Convert XJTLU image URLs to absolute

on:
  push:
    branches:
      - feature/xjtlu-absolute-image-urls-20260902
    paths:
      - '.github/workflows/preview-absolute-image-urls.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert local image references to absolute Netlify URLs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          BASE = 'https://xjtlu-korea.netlify.app/'
          IMAGE_EXT = r'(?:webp|png|jpe?g|gif|svg|avif)'

          def abs_url(raw: str) -> str:
              s = raw.strip()
              if not s or s.startswith(('http://', 'https://', 'data:', '//', '#')):
                  return raw
              clean = s[1:] if s.startswith('/') else s
              return BASE + clean

          changed = []
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              original = text

              # src="...image.ext" and poster="...image.ext"
              def repl_attr(m):
                  quote, url = m.group(1), m.group(2)
                  return m.group(0).replace(quote + url + quote, quote + abs_url(url) + quote)

              attr_pattern = re.compile(
                  r'(?i)\b(?:src|poster)\s*=\s*(["\'])(?!https?:|data:|//)([^"\']+\.' + IMAGE_EXT + r'(?:\?[^"\']*)?)\1'
              )
              text = attr_pattern.sub(repl_attr, text)

              # srcset entries
              def repl_srcset(m):
                  quote, value = m.group(1), m.group(2)
                  parts = []
                  for item in value.split(','):
                      bit = item.strip()
                      if not bit:
                          continue
                      seg = bit.split()
                      if seg and re.search(r'(?i)\.' + IMAGE_EXT + r'(?:\?.*)?$', seg[0]) and not seg[0].startswith(('http://', 'https://', 'data:', '//')):
                          seg[0] = abs_url(seg[0])
                      parts.append(' '.join(seg))
                  return 'srcset=' + quote + ', '.join(parts) + quote

              srcset_pattern = re.compile(r'(?i)\bsrcset\s*=\s*(["\'])([^"\']+)\1')
              text = srcset_pattern.sub(repl_srcset, text)

              # CSS url(...) for local images
              def repl_css(m):
                  quote = m.group(1) or ''
                  url = m.group(2).strip()
                  if url.startswith(('http://', 'https://', 'data:', '//', '#')):
                      return m.group(0)
                  if not re.search(r'(?i)\.' + IMAGE_EXT + r'(?:\?.*)?$', url):
                      return m.group(0)
                  return 'url(' + quote + abs_url(url) + quote + ')'

              css_pattern = re.compile(r'(?i)url\(\s*(["\']?)([^)"\']+)\1\s*\)')
              text = css_pattern.sub(repl_css, text)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          # Validate that no local image references remain in HTML/CSS-in-HTML.
          offenders = []
          check_attr = re.compile(
              r'(?i)\b(?:src|poster)\s*=\s*["\'](?!https?:|data:|//)([^"\']+\.' + IMAGE_EXT + r'(?:\?[^"\']*)?)["\']'
          )
          check_css = re.compile(
              r'(?i)url\(\s*["\']?(?!https?:|data:|//)([^)"\']+\.' + IMAGE_EXT + r'(?:\?[^)"\']*)?)["\']?\s*\)'
          )
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              for pattern in (check_attr, check_css):
                  for m in pattern.finditer(text):
                      offenders.append(f'{path}: {m.group(0)}')

          print('Changed files:')
          print('\n'.join(changed) if changed else '(none)')
          if offenders:
              print('Remaining local image references:')
              print('\n'.join(offenders))
              raise SystemExit(1)
          PY
      - name: Commit changes and remove one-off workflow
        run: |
          git config user.name "TNS Site Manager"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/preview-absolute-image-urls.yml
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Use absolute Netlify URLs for XJTLU images"
          git push
