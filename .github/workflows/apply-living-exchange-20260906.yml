name: Apply living cost and exchange guide update

on:
  push:
    branches:
      - feature/xjtlu-campus-life-guides-20260902

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/xjtlu-campus-life-guides-20260902
          fetch-depth: 0

      - name: Update XJTLU 2027 guides
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          index = root / 'index.html'
          tuition = root / 'xjtlu-tuition-scholarships-2027.html'
          sitemap = root / 'sitemap.xml'

          # ---------- Homepage: remove detailed living-cost table, keep only a compact internal link ----------
          s = index.read_text(encoding='utf-8')
          old_pattern = re.compile(
              r'  <!-- 오른쪽: 04 -->\n  <div style="padding:40px 36px;">.*?'
              r'<p style="font-size:11px;color:var\(--mid\);margin-top:8px;font-family:\'DM Mono\',monospace;">'
              r'\* 비자·보험·생활 관련 부대비용 별도 · 실제 금액은 학교 및 중국 정부 기준 확인</p>\n  </div>',
              re.S,
          )
          replacement = '''  <!-- 오른쪽: 04 -->
          <div style="padding:40px 36px;">
            <div class="adm-num">04</div>
            <h3 class="adm-h">생활비</h3>
            <p class="adm-p">쑤저우 생활비 정보는 별도 가이드에서 확인하세요.</p>
            <div class="related-links" aria-label="생활비 상세 가이드"><span class="related-label">관련 글</span><a class="related-link" href="xjtlu-living-cost-2027.html">XJTLU 생활비 2027<span class="arr">→</span></a></div>
          </div>'''
          s, n = old_pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'homepage living-cost block replacement failed: {n}')

          # Add new detail pages to mobile navigation.
          needle = '<a class="mob-detail" href="xjtlu-tuition-scholarships-2027.html">2027 학비·장학금</a>'
          if 'xjtlu-living-cost-2027.html' not in s:
              s = s.replace(needle, needle + '\n  <a class="mob-detail" href="xjtlu-living-cost-2027.html">XJTLU 생활비 2027</a>', 1)
          needle = '<a class="mob-detail" href="xjtlu-dual-degree-liverpool-2plus2.html">리버풀대학교 복수학위·2+2</a>'
          if 'xjtlu-exchange.html' not in s:
              s = s.replace(needle, needle + '\n  <a class="mob-detail" href="xjtlu-exchange.html">XJTLU 교환학생</a>', 1)

          # Add new detail pages to the desktop sitemap-style menu.
          old = '<section class="site-menu-group"><h3><a href="#information">학교소개 <small>메인에서 보기 →</small></a></h3><a href="xjtlu-dual-degree-liverpool-2plus2.html">리버풀대학교 복수학위·2+2</a><a href="university-of-liverpool-vietnam.html">리버풀대학교 베트남·아시아 네트워크</a></section>'
          new = '<section class="site-menu-group"><h3><a href="#information">학교소개 <small>메인에서 보기 →</small></a></h3><a href="xjtlu-dual-degree-liverpool-2plus2.html">리버풀대학교 복수학위·2+2</a><a href="xjtlu-exchange.html">XJTLU 교환학생</a><a href="university-of-liverpool-vietnam.html">리버풀대학교 베트남·아시아 네트워크</a></section>'
          if old in s:
              s = s.replace(old, new, 1)
          elif 'xjtlu-exchange.html' not in s:
              raise SystemExit('desktop school menu anchor not found')

          old = '<section class="site-menu-group"><h3><a href="#calendar">학비·장학금 <small>메인에서 보기 →</small></a></h3><a href="xjtlu-tuition-scholarships-2027.html">2027 학비·장학금 상세</a></section>'
          new = '<section class="site-menu-group"><h3><a href="#calendar">학비·장학금 <small>메인에서 보기 →</small></a></h3><a href="xjtlu-tuition-scholarships-2027.html">2027 학비·장학금 상세</a><a href="xjtlu-living-cost-2027.html">XJTLU 생활비 2027</a></section>'
          if old in s:
              s = s.replace(old, new, 1)

          # Add living-cost page to the small related-links row under the cost section.
          old = '<div class="related-links" aria-label="이 내용과 관련된 상세 가이드"><span class="related-label">관련 글</span><a class="related-link" href="xjtlu-tuition-scholarships-2027.html">2027 학비·장학금·연간 비용 자세히<span class="arr">→</span></a></div>'
          new = '<div class="related-links" aria-label="이 내용과 관련된 상세 가이드"><span class="related-label">관련 글</span><a class="related-link" href="xjtlu-tuition-scholarships-2027.html">2027 학비·장학금 자세히<span class="arr">→</span></a><a class="related-link" href="xjtlu-living-cost-2027.html">XJTLU 생활비 2027<span class="arr">→</span></a></div>'
