name: Refine XJTLU sports page

on:
  push:
    branches:
      - feature/xjtlu-campus-life-guides-20260902
    paths:
      - '.github/workflows/refine-sports-page.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/xjtlu-campus-life-guides-20260902

      - name: Refine sports page
        run: |
          python scripts/refine-sports-page.py
          git diff --check

      - name: Commit page and remove one-off files
        run: |
          git config user.name "TNS Site Manager"
          git config user.email "actions@users.noreply.github.com"
          git add xjtlu-sports-facilities.html
          git rm scripts/refine-sports-page.py .github/workflows/refine-sports-page.yml
          git commit -m "Refine SIP and Taicang sports facilities guide"
          git push origin HEAD:feature/xjtlu-campus-life-guides-20260902
