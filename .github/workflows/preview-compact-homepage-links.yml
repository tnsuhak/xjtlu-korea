name: Build compact homepage links

on:
  push:
    branches:
      - feature/xjtlu-campus-life-guides-20260902
    paths:
      - '.github/workflows/preview-compact-homepage-links.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/xjtlu-campus-life-guides-20260902

      - name: Update compact links
        run: |
          python tools/compact_homepage_links.py
          git diff --check

      - name: Commit update and remove temporary files
        run: |
          git config user.name "TNS Site Manager"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git rm tools/compact_homepage_links.py
          git rm .github/workflows/preview-compact-homepage-links.yml
          git commit -m "Compact XJTLU homepage detail links"
          git push origin HEAD:feature/xjtlu-campus-life-guides-20260902
