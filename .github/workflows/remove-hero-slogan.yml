name: Remove hero slogan

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-hero-slogan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove hero slogan from homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = '<span style="font-size:0.35em;display:block;color:rgba(255,255,255,.55);font-weight:400;letter-spacing:.05em;margin:6px 0;">(XJTLU)</span>에서<br>세계로</h1>'
          new = '<span style="font-size:0.35em;display:block;color:rgba(255,255,255,.55);font-weight:400;letter-spacing:.05em;margin:6px 0;">(XJTLU)</span></h1>'
          if old not in text:
              raise SystemExit('Target hero slogan not found; refusing to change unexpected source.')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove one-off workflow and commit
        run: |
          rm .github/workflows/remove-hero-slogan.yml
          git config user.name "TNS Site Manager"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/remove-hero-slogan.yml
          git commit -m "Remove hero slogan from XJTLU Korea homepage"
          git push
